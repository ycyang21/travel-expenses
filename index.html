// 清掉這台裝置上的登入狀態和本機快取（雲端資料不會受影響）
async function resetDevice() {
  if (!confirm('重設後這台裝置會登出，並清除本機暫存。\n雲端上的旅程不會被刪除，重新用 Google 登入就會回來。\n\n注意：離線時記的、還沒上傳的帳會遺失。確定重設？')) return;
  try { await auth.signOut(); } catch (e) {}
  Object.keys(localStorage).filter(k => k.startsWith('travelSplit_')).forEach(k => localStorage.removeItem(k));
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      dbs.filter(d => /firebase|firestore/i.test(d.name || '')).forEach(d => indexedDB.deleteDatabase(d.name));
    } else {
      indexedDB.deleteDatabase('firebaseLocalStorageDb');
    }
  } catch (e) {}
  setTimeout(() => location.reload(), 500);
}


/* =========================================================
   還款：已還、一次結清、還款方式、用其他貨幣還
   ========================================================= */
const REPAY_METHODS = [
  { id: 'cash', icon: '💵', name: '現金' },
  { id: 'transfer', icon: '🏦', name: '轉帳' },
  { id: 'other', icon: '✏️', name: '其他' }
];
const REPAY_METHOD_KEY = 'travelSplit_repayMethod';
const REPAY_OTHER_KEY = 'travelSplit_repayOther';

// 顯示用文字，例如「🏦 轉帳・實付 NT$960（匯率 32）」
function repayLabel(t) {
  const parts = [];
  if (t.method === 'offset') parts.push('⇄ 互相抵銷');
  const m = REPAY_METHODS.find(x => x.id === t.method);
  if (m) parts.push(m.id === 'other' ? `${m.icon} ${t.methodOther || '其他'}` : `${m.icon} ${m.name}`);
  if (t.paidCurrency && t.paidCurrency !== t.currency && t.paidAmount != null) {
    parts.push(`實付 ${formatAmount(t.paidAmount, t.paidCurrency)}（匯率 ${t.paidRate}）`);
  }
  return parts.join('・');
}
function rememberRepayMethod(method, other) {
  if (method) localStorage.setItem(REPAY_METHOD_KEY, method); else localStorage.removeItem(REPAY_METHOD_KEY);
  if (method === 'other') localStorage.setItem(REPAY_OTHER_KEY, other);
}
function methodChips(selected, onclickFn) {
  return REPAY_METHODS.map(m =>
    `<button class="pick ${m.id === selected ? 'on' : ''}" onclick="${onclickFn}('${m.id}')">${m.icon} ${m.name}</button>`).join('');
}

/* ---------- 寫入還款紀錄 ---------- */
function writeRepayment(expenseId, d, method = null, methodOther = '', paid = null) {
  const id = newId();
  tripRef().collection('transfers').doc(id).set({
    id, expenseId, fromId: d.fromId, toId: d.toId, amount: d.amount, currency: d.currency,
    method, methodOther,
    paidCurrency: paid ? paid.currency : null, paidAmount: paid ? paid.amount : null, paidRate: paid ? paid.rate : null,
    date: todayStr(), createdAt: Date.now(), createdBy: myUid, v: 2
  }).catch(onWriteError);
}

// 儲存支出後呼叫：金額、付款人可能改了，所以先刪掉這筆支出舊的還款紀錄，
// 再依「當場已經還錢的人」和最新金額重建
function syncExpenseRepayments(e, repayState) {
  const debts = expenseDebts(e);
  const old = transfers.filter(t => t.expenseId === e.id);
  old.forEach(t => tripRef().collection('transfers').doc(t.id).delete().catch(onWriteError));
  let last = null;
  debts.forEach(d => {
    const st = repayState[d.fromId];
    if (!st || !st.checked) return;
    const prev = old.find(t => t.fromId === d.fromId) || {};
    // 原本用其他貨幣還的，照原本的匯率重算實付金額（幣別改了就不沿用）
    const paid = (prev.paidCurrency && prev.paidRate && prev.currency === d.currency)
      ? { currency: prev.paidCurrency, rate: prev.paidRate, amount: Math.round(d.amount * prev.paidRate) } : null;
    const other = st.method === 'other' ? (st.methodOther || '').trim() : '';
    writeRepayment(e.id, d, st.method || null, other, paid);
    if (st.method && st.method !== 'offset') last = [st.method, other];
  });
  if (last) rememberRepayMethod(last[0], last[1]);
}

/* ---------- 逐項：已還 ---------- */
function markItemPaid(expenseId, fromId) {
  const e = expenses.find(x => x.id === expenseId);
  const d = e && expenseDebts(e).find(x => x.fromId === fromId);
  if (!d) return;
  openRepaySheet({
    title: '確認已還款',
    desc: `${memberName(d.fromId)} 還給 ${memberName(d.toId)} ${formatAmount(d.amount, d.currency)}（${e.title}）`,
    debtCurrency: d.currency, debtAmount: d.amount,
    onConfirm: (method, other, paid) => writeRepayment(expenseId, d, method, other, paid)
  });
}

function undoItemPaid(expenseId, fromId) {
  const t = repaymentOf(expenseId, fromId);
  if (!t) return;
  if (!confirm(`取消「${memberName(fromId)} 已還」？`)) return;
  tripRef().collection('transfers').doc(t.id).delete().catch(onWriteError);
}

/* ---------- 未還加總：一次結清 ----------
   把這兩人之間、這個貨幣所有還沒還的項目一次標記為已還。
   反方向的項目（例如 A 欠 B 的）標記為「互相抵銷」。 */
function settlePair(currency, fromId, toId) {
  const debts = unpaidDebts(currency).filter(d =>
    (d.fromId === fromId && d.toId === toId) || (d.fromId === toId && d.toId === fromId));
  if (!debts.length) return;
  const forward = debts.filter(d => d.fromId === fromId);
  const backward = debts.filter(d => d.fromId !== fromId);
  const net = forward.reduce((a, d) => a + d.amount, 0) - backward.reduce((a, d) => a + d.amount, 0);
  const writeOffsets = () => backward.forEach(d => writeRepayment(d.expenseId, d, 'offset', ''));

  if (net === 0) {
    if (!confirm(`${memberName(fromId)} 和 ${memberName(toId)} 之間的 ${debts.length} 項剛好互相抵銷，標記為兩清？`)) return;
    forward.forEach(d => writeRepayment(d.expenseId, d, 'offset', ''));
    writeOffsets();
    return;
  }
  openRepaySheet({
    title: '一次結清',
    desc: `${memberName(fromId)} 還給 ${memberName(toId)} ${formatAmount(net, currency)}（共 ${debts.length} 項）`,
    debtCurrency: currency, debtAmount: net,
    onConfirm: (method, other, paid) => {
      // 用其他貨幣還時，實付金額依各項金額比例分到每一項，加總剛好等於實付金額
      const paidParts = paid ? allocate(paid.amount, forward.map(d => d.amount)) : null;
      forward.forEach((d, i) => writeRepayment(d.expenseId, d, method, other,
        paid ? { currency: paid.currency, rate: paid.rate, amount: paidParts[i] } : null));
      writeOffsets();
    }
  });
}

/* ---------- 修改已還的紀錄 ---------- */
function editRepayMethod(transferId) {
  const t = transfers.find(x => x.id === transferId);
  if (!t) return;
  openRepaySheet({
    title: '修改還款',
    desc: `${memberName(t.fromId)} 還給 ${memberName(t.toId)} ${formatAmount(t.amount, t.currency)}`,
    debtCurrency: t.currency, debtAmount: t.amount,
    method: t.method || null, methodOther: t.methodOther || '',
    paid: t.paidCurrency ? { currency: t.paidCurrency, amount: t.paidAmount, rate: t.paidRate } : null,
    okText: '儲存', remember: false,
    onConfirm: (method, methodOther, paid) =>
      tripRef().collection('transfers').doc(t.id).update({
        method, methodOther,
        paidCurrency: paid ? paid.currency : null, paidAmount: paid ? paid.amount : null, paidRate: paid ? paid.rate : null
      }).catch(onWriteError)
  });
}

/* =========================================================
   還款面板
   ---------------------------------------------------------
   - 還款方式：現金／轉帳／其他（可不選）
   - 外幣欠款才有：用什麼貨幣還。選原幣以外的貨幣時，
     輸入匯率或實付金額（改其中一個，另一個自動算），也可以按「抓匯率」。
   ========================================================= */
let repaySheet = null;

function openRepaySheet({ title, desc, debtCurrency, debtAmount, method, methodOther, paid, okText, onConfirm, remember = true }) {
  repaySheet = {
    method: method !== undefined ? method : (localStorage.getItem(REPAY_METHOD_KEY) || null),
    debtCurrency, debtAmount,
    paidCurrency: paid ? paid.currency : debtCurrency,
    onConfirm, remember
  };
  document.getElementById('repay-title').textContent = title;
  document.getElementById('repay-desc').textContent = desc;
  document.getElementById('repay-ok').textContent = okText || '確定';
  document.getElementById('repay-other').value =
    methodOther !== undefined ? methodOther : (localStorage.getItem(REPAY_OTHER_KEY) || '');
  // 外幣欠款才能選「用其他貨幣還」
  document.getElementById('repay-cur-box').style.display = debtCurrency !== trip.baseCurrency ? 'block' : 'none';
  document.getElementById('repay-rate').value = paid ? paid.rate : '';
  document.getElementById('repay-paid').value = paid ? minorToText(paid.amount, paid.currency) : '';
  document.getElementById('repay-rate-src').textContent = '';
  renderRepaySheet();
  document.getElementById('repay-sheet').classList.add('show');
}

function renderRepaySheet() {
  const r = repaySheet;
  document.getElementById('repay-methods').innerHTML = methodChips(r.method, 'pickSheetMethod');
  document.getElementById('repay-other').style.display = r.method === 'other' ? 'block' : 'none';
  // 貨幣選項：原幣、結算幣別、其他
  const order = [r.debtCurrency, trip.baseCurrency, ...Object.keys(CURRENCIES)].filter((c, i, a) => a.indexOf(c) === i);
  document.getElementById('repay-currencies').innerHTML = order.map(c =>
    `<button class="pick ${c === r.paidCurrency ? 'on' : ''}" onclick="pickRepayCurrency('${c}')">${c}${c === r.debtCurrency ? '（原幣）' : ''}</button>`).join('');
  const other = r.paidCurrency !== r.debtCurrency;
  document.getElementById('repay-rate-box').style.display = other ? 'block' : 'none';
  if (other) {
    document.getElementById('repay-rate-label').textContent = `匯率（1 ${r.debtCurrency} ＝ 幾 ${r.paidCurrency}）`;
    document.getElementById('repay-paid-label').textContent = `實付金額（${r.paidCurrency}）`;
  }
}

function pickSheetMethod(id) {
  repaySheet.method = repaySheet.method === id ? null : id;   // 再點一次 = 取消
  renderRepaySheet();
}

function rateKey(from, to) { return `${from}_${to}`; }

function pickRepayCurrency(c) {
  const r = repaySheet;
  if (r.paidCurrency === c) return;
  r.paidCurrency = c;
  document.getElementById('repay-rate-src').textContent = '';
  document.getElementById('repay-rate').value = '';
  document.getElementById('repay-paid').value = '';
  renderRepaySheet();
  if (c !== r.debtCurrency) {
    // 先帶入上次這兩種貨幣講好的匯率；沒有的話去抓
    const saved = (trip.rates || {})[rateKey(r.debtCurrency, c)];
    if (saved) {
      document.getElementById('repay-rate').value = saved;
      onRepayRateInput();
      document.getElementById('repay-rate-src').textContent = '上次使用的匯率，可以修改';
    } else fetchRepayRate();
  }
}

// 改匯率 → 重算實付金額
function onRepayRateInput() {
  const r = repaySheet;
  const rate = parseFloat(document.getElementById('repay-rate').value);
  document.getElementById('repay-paid').value = rate > 0 ? minorToText(Math.round(r.debtAmount * rate), r.paidCurrency) : '';
}
// 改實付金額 → 反推匯率
function onRepayPaidInput() {
  const r = repaySheet;
  const paid = parseAmount(document.getElementById('repay-paid').value || '0', r.paidCurrency);
  if (paid && r.debtAmount) document.getElementById('repay-rate').value = parseFloat((paid / r.debtAmount).toPrecision(6));
  document.getElementById('repay-rate-src').textContent = '依實付金額計算';
}

async function fetchRepayRate() {
  const r = repaySheet;
  const from = r.debtCurrency, to = r.paidCurrency;
  const src = document.getElementById('repay-rate-src');
  if (!navigator.onLine) { src.textContent = '目前離線，請手動輸入'; return; }
  src.textContent = '正在抓匯率…';
  try {
    const { rate, date } = await getRate(from, to, todayStr());
    if (repaySheet !== r || r.paidCurrency !== to) return;   // 面板已關閉或換了貨幣
    document.getElementById('repay-rate').value = rate;
    onRepayRateInput();
    const [, m, d] = date.split('-');
    src.textContent = `${Number(m)}/${Number(d)} 國際市場匯率，可以改成你們講好的數字`;
  } catch (e) {
    if (repaySheet === r) src.textContent = '抓不到匯率，請手動輸入';
  }
}

function closeRepaySheet() {
  document.getElementById('repay-sheet').classList.remove('show');
  repaySheet = null;
}

function confirmRepaySheet() {
  const r = repaySheet;
  if (!r) return;
  const method = r.method;
  const other = method === 'other' ? document.getElementById('repay-other').value.trim() : '';
  let paid = null;
  if (r.paidCurrency !== r.debtCurrency) {
    const amount = parseAmount(document.getElementById('repay-paid').value || '', r.paidCurrency);
    const rate = parseFloat(document.getElementById('repay-rate').value);
    if (!amount || !(rate > 0)) { alert('請輸入匯率或實付金額'); return; }
    paid = { currency: r.paidCurrency, amount, rate };
    // 記住這次講好的匯率，下次同樣的貨幣會自動帶入
    tripRef().update({ ['rates.' + rateKey(r.debtCurrency, r.paidCurrency)]: rate }).catch(onWriteError);
  }
  if (r.remember) rememberRepayMethod(method, other);
  const fn = r.onConfirm;
  closeRepaySheet();
  fn(method, other, paid);
}

/* ---------- 新增支出表單：「還」這一段 ----------
   列出除了付款人以外、要分攤的每個人，勾選代表他當場已經還錢。
   勾選後才出現還款方式，每個人可以不一樣。 */
function formShares() {
  const cur = draft.currency;
  const amount = parseAmount(document.getElementById('f-amount').value || '0', cur) || 0;
  const ids = draft.participants;
  const out = {};
  if (draft.splitMode === 'equal') {
    const parts = allocate(amount, ids.map(() => 1));
    ids.forEach((id, i) => { out[id] = parts[i]; });
  } else {
    ids.forEach(id => { out[id] = parseAmount(draft.customText[id] || '0', cur); });
  }
  return out;
}

function renderFormRepay() {
  if (!draft) return;
  const box = document.getElementById('f-repay-list');
  if (draft.selfPay) { box.innerHTML = ''; return; }
  const shares = formShares();
  const debtors = draft.participants.filter(id => id !== draft.payerId);
  if (!debtors.length) {
    box.innerHTML = '<p class="hint" style="margin-top:0">沒有人需要還錢（只有付款人自己分攤）</p>';
    return;
  }
  const payerName = escapeHTML(memberName(draft.payerId));
  box.innerHTML = debtors.map(id => {
    const st = draft.repay[id] || {};
    const amt = shares[id] ? formatAmount(shares[id], draft.currency) : '—';
    let extra = '';
    if (st.checked) {
      extra = `<div class="mini-chips">${REPAY_METHODS.map(m =>
        `<button class="pick mini ${st.method === m.id ? 'on' : ''}" onclick="pickFormRepay('${id}','${m.id}')">${m.icon} ${m.name}</button>`).join('')}</div>`;
      if (st.method === 'other') {
        extra += `<input class="repay-other" value="${escapeHTML(st.methodOther || '')}" placeholder="例如：LINE Pay、美金現金"
          oninput="draft.repay['${id}'].methodOther = this.value">`;
      }
    }
    return `<div class="repay-row">
      <label class="check-row"><input type="checkbox" ${st.checked ? 'checked' : ''} onchange="toggleFormRepay('${id}', this.checked)">
        <span>${escapeHTML(memberName(id))} 還 ${payerName} ${amt}</span></label>
      ${extra}
    </div>`;
  }).join('');
}

function toggleFormRepay(id, checked) {
  if (!draft.repay[id]) {
    // 第一次勾選：帶入這台裝置上次用的還款方式
    draft.repay[id] = { method: localStorage.getItem(REPAY_METHOD_KEY) || null, methodOther: localStorage.getItem(REPAY_OTHER_KEY) || '' };
  }
  draft.repay[id].checked = checked;
  renderFormRepay();
}

function pickFormRepay(id, method) {
  const st = draft.repay[id];
  st.method = st.method === method ? null : method;   // 再點一次 = 取消
  renderFormRepay();
}

/* =========================================================
   統計
   ---------------------------------------------------------
   全部用已經記下的支出算，不需要另外輸入。各幣別分開，不互相換算。
   ========================================================= */
// 一組橫條：rows = [{ label, value }]，長度依最大值比例
function barRows(rows, currency) {
  const total = rows.reduce((a, r) => a + r.value, 0);
  const max = Math.max(...rows.map(r => r.value), 1);
  return rows.map(r => `<div class="stat-row">
      <span>${r.label}</span>
      <span class="bar"><span style="width:${Math.max(2, r.value / max * 100)}%"></span></span>
      <span class="val">${formatAmount(r.value, currency)}<small>${total ? Math.round(r.value / total * 100) : 0}%</small></span>
    </div>`).join('');
}

function renderStats() {
  const box = document.getElementById('stats-box');
  if (!trip) return;
  if (!expenses.length) {
    box.innerHTML = '<div class="empty"><strong>還沒有支出</strong>記幾筆帳之後，這裡會顯示花費統計</div>';
    return;
  }
  let html = '';
  const sharedAll = expenses.filter(e => !isPersonal(e));
  for (const c of tripCurrencies(sharedAll)) {
    const list = sharedAll.filter(e => e.currency === c);
    const total = list.reduce((a, e) => a + e.amount, 0);

    // 分類
    const byCat = CATEGORIES.map(cat => ({
      label: `${cat.icon} ${cat.name}`,
      value: list.filter(e => (e.category || 'other') === cat.id).reduce((a, e) => a + e.amount, 0)
    })).filter(r => r.value).sort((a, b) => b.value - a.value);

    // 每日（依日期排序）
    const days = {};
    list.forEach(e => { days[e.date] = (days[e.date] || 0) + e.amount; });
    const byDay = Object.keys(days).sort().map(d => {
      const [, m, dd] = d.split('-');
      return { label: `${Number(m)}/${Number(dd)}`, value: days[d] };
    });

    // 付款方式
    const byMethod = [...PAY_METHODS.map(m => ({ id: m.id, label: `${m.icon} ${m.name}` })), { id: null, label: '未填' }]
      .map(m => ({ label: m.label, value: list.filter(e => (e.paymentMethod || null) === m.id).reduce((a, e) => a + e.amount, 0) }))
      .filter(r => r.value);

    html += `<div class="card">
      <div class="block-head"><h2>${CURRENCIES[c].name} ${c}</h2><span>共同開銷 <b>${formatAmount(total, c)}</b></span></div>
      ${section('cat-' + c, '分類', '', barRows(byCat, c), true)}
      ${section('day-' + c, '每日', `${byDay.length} 天`, barRows(byDay, c), true)}
      ${section('pm-' + c, '付款方式', '', barRows(byMethod, c) +
        (byMethod.some(r => r.label.includes('信用卡')) ? '<p class="hint">收到信用卡帳單時，可以用刷卡總額核對</p>' : ''), false)}
    </div>`;
  }
  html += `<div class="card"><h2>每人花費</h2>${renderSpending()}
    <p class="hint">以上各幣別分開計算。個人開銷不算進上方的分類、每日統計。</p></div>`;
  box.innerHTML = html;
}
