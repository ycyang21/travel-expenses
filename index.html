<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover：讓畫面延伸到 iPhone 瀏海／底部橫條下方，再用 safe-area 留白 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<title>旅途分帳</title>
<style>
  /* ===== 色彩與字體設定（集中在這裡，之後改色只要改這幾行） ===== */
  :root {
    --ink: #1B2A41;       /* 主色：深海軍藍，像護照封面 */
    --paper: #F7F9FB;     /* 背景 */
    --card: #FFFFFF;
    --stamp: #2E5AAC;     /* 按鈕、強調 */
    --line: #D9E0E8;
    --muted: #6B7A8C;
    --plus: #1F8A70;      /* 結算：應收（正數） */
    --minus: #C8453A;     /* 結算：應付（負數） */
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-size: 16px; line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; }

  /* ===== 頁首：做成車票的樣子（這個 App 唯一的「裝飾」） ===== */
  .ticket {
    background: var(--ink); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 18px;
    position: relative;
  }
  .ticket::after { /* 票根撕線 */
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 8px;
    background: radial-gradient(circle at 6px 8px, var(--paper) 5px, transparent 5.5px) repeat-x;
    background-size: 12px 8px;
  }
  .ticket h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .ticket p { margin: 2px 0 0; font-size: 14px; opacity: .75; }

  /* ===== 主內容區（底部留空間給分頁列） ===== */
  main { padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 90px); max-width: 560px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }
  h2 { font-size: 18px; margin: 0 0 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, select {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); font-size: 16px; /* 16px 以上 iPhone 才不會自動放大 */
  }
  .btn {
    display: block; width: 100%; padding: 14px; margin-top: 16px;
    border: 0; border-radius: 10px; background: var(--stamp); color: #fff; font-weight: 600;
  }
  .btn.ghost { background: transparent; color: var(--stamp); border: 1px solid var(--stamp); }
  .btn.danger { background: transparent; color: var(--minus); border: 1px solid var(--minus); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  .small-btn { padding: 12px 14px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; white-space: nowrap; }

  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: #E8EEF6; font-size: 15px; }
  .chip button { border: 0; background: none; color: var(--muted); margin-left: 4px; padding: 0; }
  .chip.me { background: var(--ink); color: #fff; }

  .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
  .empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

  /* ===== 底部分頁列 ===== */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; display: none;
    background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs.show { display: flex; }
  nav.tabs button {
    flex: 1; border: 0; background: none; padding: 10px 0 8px;
    font-size: 12px; color: var(--muted);
  }
  nav.tabs button span { display: block; font-size: 22px; line-height: 1.2; }
  nav.tabs button.active { color: var(--ink); font-weight: 600; }
  nav.tabs .add span { /* 中間的「新增」做成圓形大按鈕，最常用 */
    width: 46px; height: 46px; margin: -18px auto 2px; border-radius: 50%;
    background: var(--stamp); color: #fff; line-height: 46px; font-size: 28px;
  }
</style>
</head>
<body>

<header class="ticket">
  <h1 id="trip-title">旅途分帳</h1>
  <p id="trip-sub">建立一趟旅程開始記帳</p>
</header>

<main>
  <!-- 頁面 0：建立旅程（還沒有旅程時才出現） -->
  <section class="page" id="page-setup">
    <div class="card">
      <h2>建立旅程</h2>
      <label for="setup-name">旅程名稱</label>
      <input id="setup-name" placeholder="例如：紐約波士頓 2027">
      <label for="setup-currency">結算幣別（大家最後用什麼錢還）</label>
      <select id="setup-currency">
        <option value="TWD">新台幣 TWD</option>
        <option value="USD">美元 USD</option>
        <option value="JPY">日圓 JPY</option>
        <option value="EUR">歐元 EUR</option>
      </select>
      <label for="setup-member">旅伴（第一個加入的是你自己）</label>
      <div class="row">
        <input id="setup-member" placeholder="輸入名字">
        <button class="small-btn" onclick="addSetupMember()">加入</button>
      </div>
      <div class="chip-list" id="setup-members"></div>
      <button class="btn" onclick="createTrip()">建立旅程</button>
    </div>
  </section>

  <!-- 頁面 1：支出列表 -->
  <section class="page" id="page-list">
    <div class="empty"><strong>還沒有任何支出</strong>點下方的 ＋ 記下第一筆</div>
  </section>

  <!-- 頁面 2：新增支出（第二步會完成） -->
  <section class="page" id="page-add">
    <div class="empty"><strong>新增支出</strong>下一步會在這裡做表單</div>
  </section>

  <!-- 頁面 3：結算（第三步會完成） -->
  <section class="page" id="page-settle">
    <div class="empty"><strong>結算</strong>第三步會在這裡算出誰該給誰多少</div>
  </section>

  <!-- 頁面 4：設定 -->
  <section class="page" id="page-settings">
    <div class="card">
      <h2>旅伴</h2>
      <div class="chip-list" id="settings-members"></div>
      <label for="new-member">加入新旅伴</label>
      <div class="row">
        <input id="new-member" placeholder="輸入名字">
        <button class="small-btn" onclick="addMemberLater()">加入</button>
      </div>
    </div>
    <button class="btn danger" onclick="resetTrip()">刪除這趟旅程</button>
  </section>
</main>

<nav class="tabs" id="tabs">
  <button data-page="page-list" onclick="showPage('page-list')"><span>🧾</span>支出</button>
  <button data-page="page-add" class="add" onclick="showPage('page-add')"><span>＋</span>新增</button>
  <button data-page="page-settle" onclick="showPage('page-settle')"><span>⚖️</span>結算</button>
  <button data-page="page-settings" onclick="showPage('page-settings')"><span>⚙️</span>設定</button>
</nav>

<script>
/* =========================================================
   資料結構（刻意設計成跟之後 Firebase 一樣的形狀）
   trip = {
     id, name, baseCurrency, createdAt,
     members: [ { id, name, uid } ]   ← uid 第四步接 Firebase 時用來綁定「誰是誰」
   }
   expenses = [ ... ]                  ← 第二步開始放資料
   ========================================================= */
const STORAGE_KEY = 'travelSplit_v1';
let trip = null;
let expenses = [];
let setupMembers = [];   // 建立旅程時暫存的名字

// 產生不重複 id（時間 + 亂數）
function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// 防止名字裡有 < > 之類的字元破壞畫面
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

/* ---------- 存取 ---------- */
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ trip, expenses }));
  } catch (e) {
    alert('儲存失敗：' + e.message);
  }
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    trip = data.trip || null;
    expenses = data.expenses || [];
  } catch (e) {
    console.error('讀取失敗', e);
  }
}

/* ---------- 換頁 ---------- */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.page === id));
  window.scrollTo(0, 0);
}

/* ---------- 建立旅程 ---------- */
function addSetupMember() {
  const input = document.getElementById('setup-member');
  const name = input.value.trim();
  if (!name) return;
  if (setupMembers.includes(name)) { alert('這個名字已經加入了'); return; }
  setupMembers.push(name);
  input.value = '';
  input.focus();
  renderSetupMembers();
}
function removeSetupMember(i) {
  setupMembers.splice(i, 1);
  renderSetupMembers();
}
function renderSetupMembers() {
  document.getElementById('setup-members').innerHTML = setupMembers.map((n, i) =>
    `<span class="chip ${i === 0 ? 'me' : ''}">${escapeHTML(n)}${i === 0 ? '（我）' : ''}` +
    `<button onclick="removeSetupMember(${i})" aria-label="移除">✕</button></span>`
  ).join('');
}
function createTrip() {
  const name = document.getElementById('setup-name').value.trim();
  if (!name) { alert('請輸入旅程名稱'); return; }
  if (setupMembers.length < 2) { alert('分帳至少需要兩個人'); return; }
  trip = {
    id: newId(),
    name,
    baseCurrency: document.getElementById('setup-currency').value,
    createdAt: Date.now(),
    members: setupMembers.map(n => ({ id: newId(), name: n, uid: null }))
  };
  expenses = [];
  setupMembers = [];
  saveData();
  render();
}

/* ---------- 設定頁 ---------- */
function addMemberLater() {
  const input = document.getElementById('new-member');
  const name = input.value.trim();
  if (!name) return;
  if (trip.members.some(m => m.name === name)) { alert('這個名字已經在旅程裡了'); return; }
  trip.members.push({ id: newId(), name, uid: null });
  input.value = '';
  saveData();
  render();
}
function resetTrip() {
  if (!confirm(`確定要刪除「${trip.name}」和所有支出嗎？無法復原。`)) return;
  trip = null;
  expenses = [];
  saveData();
  render();
}

/* ---------- 畫面更新（資料變動後都呼叫這個） ---------- */
function render() {
  const tabs = document.getElementById('tabs');
  if (!trip) {
    document.getElementById('trip-title').textContent = '旅途分帳';
    document.getElementById('trip-sub').textContent = '建立一趟旅程開始記帳';
    tabs.classList.remove('show');
    renderSetupMembers();
    showPage('page-setup');
    return;
  }
  document.getElementById('trip-title').textContent = trip.name;
  document.getElementById('trip-sub').textContent =
    `${trip.members.length} 人同行，以 ${trip.baseCurrency} 結算`;
  document.getElementById('settings-members').innerHTML = trip.members.map((m, i) =>
    `<span class="chip ${i === 0 ? 'me' : ''}">${escapeHTML(m.name)}</span>`
  ).join('');
  tabs.classList.add('show');
  // 目前在設定頁就留在設定頁，否則回到支出列表
  const current = document.querySelector('.page.active');
  if (!current || current.id === 'page-setup') showPage('page-list');
}

// 輸入名字後按鍵盤的 Enter 也能加入
document.getElementById('setup-member').addEventListener('keydown', e => { if (e.key === 'Enter') addSetupMember(); });
document.getElementById('new-member').addEventListener('keydown', e => { if (e.key === 'Enter') addMemberLater(); });

/* ---------- 啟動（永遠放在 script 最後面，所有變數和函式都定義好之後才執行） ---------- */
loadData();
render();
</script>
</body>
</html>
