<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover：讓畫面延伸到 iPhone 瀏海／底部橫條下方，再用 safe-area 留白 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<title>旅途分帳</title>
<style>
  /* ===== 色彩與字體設定（集中在這裡，之後改色只要改這幾行） ===== */
  :root {
    --ink: #1B2A41;       /* 主色：深海軍藍，像護照封面 */
    --paper: #F7F9FB;     /* 背景 */
    --card: #FFFFFF;
    --stamp: #2E5AAC;     /* 按鈕、強調 */
    --line: #D9E0E8;
    --muted: #6B7A8C;
    --plus: #1F8A70;      /* 結算：應收（正數） */
    --minus: #C8453A;     /* 結算：應付（負數） */
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-size: 16px; line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; }

  /* ===== 頁首：做成車票的樣子（這個 App 唯一的「裝飾」） ===== */
  .ticket {
    background: var(--ink); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 18px;
    position: relative;
  }
  .ticket::after { /* 票根撕線 */
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 8px;
    background: radial-gradient(circle at 6px 8px, var(--paper) 5px, transparent 5.5px) repeat-x;
    background-size: 12px 8px;
  }
  .ticket h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .ticket p { margin: 2px 0 0; font-size: 14px; opacity: .75; }

  /* ===== 主內容區（底部留空間給分頁列） ===== */
  main { padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 90px); max-width: 560px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }
  h2 { font-size: 18px; margin: 0 0 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, select {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); font-size: 16px; /* 16px 以上 iPhone 才不會自動放大 */
  }
  .btn {
    display: block; width: 100%; padding: 14px; margin-top: 16px;
    border: 0; border-radius: 10px; background: var(--stamp); color: #fff; font-weight: 600;
  }
  .btn.ghost { background: transparent; color: var(--stamp); border: 1px solid var(--stamp); }
  .btn.danger { background: transparent; color: var(--minus); border: 1px solid var(--minus); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  .small-btn { padding: 12px 14px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; white-space: nowrap; }

  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: #E8EEF6; font-size: 15px; }
  .chip button { border: 0; background: none; color: var(--muted); margin-left: 4px; padding: 0; }
  .chip.me { background: var(--ink); color: #fff; }

  .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
  .empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

  /* ===== 底部分頁列 ===== */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; display: none;
    background: #fff; border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabs.show { display: flex; }
  nav.tabs button {
    flex: 1; border: 0; background: none; padding: 10px 0 8px;
    font-size: 12px; color: var(--muted);
  }
  nav.tabs button span { display: block; font-size: 22px; line-height: 1.2; }
  nav.tabs button.active { color: var(--ink); font-weight: 600; }
  nav.tabs .add span { /* 中間的「新增」做成圓形大按鈕，最常用 */
    width: 46px; height: 46px; margin: -18px auto 2px; border-radius: 50%;
    background: var(--stamp); color: #fff; line-height: 46px; font-size: 28px;
  }

  /* ===== 第二步：支出表單與列表 ===== */
  .amount-row { display: flex; gap: 8px; }
  .amount-row input { flex: 1; font-size: 22px; font-weight: 600; }
  .amount-row select { width: 96px; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .pick-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); font-size: 15px;
  }
  .pick.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 12px; }
  .seg button { flex: 1; padding: 10px; border: 0; background: #fff; color: var(--muted); }
  .seg button.on { background: var(--ink); color: #fff; }
  .custom-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .custom-row span { width: 80px; }
  .custom-row input { flex: 1; }
  .remain { font-weight: 600; margin-top: 8px; }
  .remain.ok { color: var(--plus); }
  .remain.bad { color: var(--minus); }

  .day-head { font-size: 14px; color: var(--muted); margin: 18px 4px 6px; display: flex; justify-content: space-between; }
  .exp {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; color: var(--ink);
  }
  .exp .icon { font-size: 24px; }
  .exp .mid { flex: 1; min-width: 0; }
  .exp .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp .who { font-size: 13px; color: var(--muted); }
  .exp .money { text-align: right; font-weight: 600; }
  .exp .money small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
  .total-bar { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; }
  .total-bar strong { font-size: 22px; }

  /* ===== 第三步：結算 ===== */
  .bal { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .bal:last-child { border-bottom: 0; }
  .bal .name { font-weight: 600; }
  .bal .detail { font-size: 13px; color: var(--muted); }
  .bal .net { font-weight: 700; text-align: right; }
  .net.plus { color: var(--plus); }
  .net.minus { color: var(--minus); }
  .net.zero { color: var(--muted); }
  .transfer { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .transfer:last-child { border-bottom: 0; }
  .transfer .flow { flex: 1; }
  .transfer .flow b { font-weight: 600; }
  .transfer .amt { display: block; font-size: 20px; font-weight: 700; }
  .transfer .done-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--plus); background: #fff; color: var(--plus); white-space: nowrap; }
  .transfer.paid { color: var(--muted); }
  .transfer.paid .undo-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--muted); white-space: nowrap; }
  .all-clear { text-align: center; padding: 20px 0 8px; color: var(--plus); font-weight: 600; }

  /* ===== 第四步：旅程列表、加入、邀請 ===== */
  .trip-item {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    padding: 14px; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink); text-align: left;
  }
  .trip-item small { color: var(--muted); }
  .chip.pending { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .invite-link { font-size: 14px; word-break: break-all; background: var(--paper); padding: 10px; border-radius: 8px; margin-top: 8px; }
  .join-pick { display: block; width: 100%; padding: 14px; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); text-align: left; font-size: 17px; }
  .join-pick small { float: right; color: var(--muted); font-size: 14px; }

  /* ===== 內建計算機 ===== */
  /* 連點兩下不會放大畫面（iPhone／iPad 的「點兩下縮放」），手指兩指縮放仍然可以用 */
  button, .calc, .calc-panel { touch-action: manipulation; }
  .calc-keys button { -webkit-user-select: none; user-select: none; }

  /* 輸入框右側的計算機小圖示 */
  .calc-wrap { position: relative; flex: 1; min-width: 0; }
  .calc-wrap input { width: 100%; padding-right: 46px; }
  .calc-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border: 0; border-radius: 8px;
    background: none; color: var(--muted); display: flex; align-items: center; justify-content: center;
  }
  .calc-btn:active { background: var(--paper); }
  .calc-btn svg { width: 20px; height: 20px; }
  .calc { position: fixed; inset: 0; z-index: 50; display: none; }
  .calc.show { display: block; }
  .calc-backdrop { position: absolute; inset: 0; background: rgba(27, 42, 65, .35); }
  .calc-panel {
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    background: #fff; border-radius: 16px 16px 0 0;
    padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    box-shadow: 0 -4px 20px rgba(27, 42, 65, .15);
  }
  .calc-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--muted); }
  .calc-top button { border: 0; background: none; color: var(--muted); font-size: 15px; padding: 4px 0 4px 12px; }
  .calc-expr { min-height: 24px; text-align: right; font-size: 18px; color: var(--muted); word-break: break-all; margin-top: 6px; }
  .calc-result { text-align: right; font-size: 34px; font-weight: 700; line-height: 1.2; }
  .calc-note { min-height: 20px; text-align: right; font-size: 13px; color: var(--muted); }
  .calc-quick { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .calc-quick:empty { display: none; }
  .calc-quick button { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--stamp); background: #fff; color: var(--stamp); font-size: 14px; }
  .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .calc-keys button {
    height: 54px; border: 0; border-radius: 10px; background: #EEF2F7; color: var(--ink);
    font-size: 22px; font-weight: 500;
  }
  .calc-keys button:active { background: var(--line); }
  .calc-keys .op { background: #DCE5F2; color: var(--stamp); font-weight: 700; }
  .calc-keys .fn { font-size: 18px; color: var(--muted); }
  .calc-keys .ok { grid-row: span 2; height: auto; background: var(--stamp); color: #fff; font-size: 18px; font-weight: 600; }
  .calc-keys .zero { grid-column: span 2; }

  /* ===== 備註與照片 ===== */
  textarea {
    width: 100%; min-height: 80px; padding: 12px; resize: vertical;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
    font: inherit; font-size: 16px;
  }
  .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--paper); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .rm {
    position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
    border: 0; background: rgba(27, 42, 65, .75); color: #fff; font-size: 14px; line-height: 26px; padding: 0;
  }
  .add-photo {
    aspect-ratio: 1; border: 1px dashed var(--muted); border-radius: 8px; background: #fff;
    color: var(--muted); font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .add-photo span { font-size: 22px; }
  .viewer { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .92); display: none; align-items: center; justify-content: center; }
  .viewer.show { display: flex; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer .close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 16px; color: #fff; font-size: 15px; border: 0; background: rgba(255,255,255,.15); border-radius: 999px; padding: 8px 14px; }

  /* ===== 自動抓匯率 ===== */
  .rate-row { display: flex; gap: 8px; }
  .rate-row input { flex: 1; min-width: 0; }
  .rate-fetch { padding: 0 12px; border: 1px solid var(--stamp); border-radius: 8px; background: #fff; color: var(--stamp); white-space: nowrap; font-size: 15px; }
  .rate-fetch:disabled { opacity: .5; }

  /* ===== 帳號 ===== */
  .account-row { display: flex; align-items: center; gap: 10px; }
  .account-row .who-am-i { flex: 1; min-width: 0; font-size: 15px; }
  .account-row .who-am-i small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px;
    padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-weight: 600;
  }
  .google-btn svg { width: 18px; height: 18px; }

  /* ===== 逐筆還款 ===== */
  .check-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; color: var(--ink); font-size: 16px; }
  .check-row input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--plus); }
  .check-row small { display: block; color: var(--muted); font-size: 13px; }
  details.items > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  details.items > summary::-webkit-details-marker { display: none; }
  details.items > summary h2 { margin: 0; }
  details.items > summary .arrow { display: inline-block; color: var(--muted); transition: transform .2s; }
  details.items[open] > summary .arrow { transform: rotate(90deg); }
  .item-exp { border-top: 1px solid var(--line); padding: 12px 0 4px; margin-top: 12px; }
  .item-exp .head { display: flex; justify-content: space-between; font-weight: 600; }
  .item-exp .head small { font-weight: 400; color: var(--muted); }
  .item-debt { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .item-debt .txt { flex: 1; }
  .item-debt .txt .detail { font-size: 13px; color: var(--muted); }
  .item-debt.paid .txt .line { color: var(--muted); text-decoration: line-through; }
  .item-debt .done-btn, .item-debt .undo-btn { padding: 6px 12px; border-radius: 8px; background: #fff; white-space: nowrap; font-size: 14px; }
  .item-debt .done-btn { border: 1px solid var(--plus); color: var(--plus); }
  .item-debt .undo-btn { border: 1px solid var(--line); color: var(--muted); }
  .settled-tag { color: var(--plus); }

  /* ===== 還款方式 ===== */
  .sheet { position: fixed; inset: 0; z-index: 55; display: none; }
  .sheet.show { display: block; }
  .sheet-panel {
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    background: #fff; border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    box-shadow: 0 -4px 20px rgba(27, 42, 65, .15);
  }
  .sheet-panel { max-height: 90vh; overflow-y: auto; }
  .sheet-panel h2 { margin-bottom: 4px; }
  .block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .block-head h2 { margin: 0; }
  .block-head span { color: var(--muted); font-size: 14px; }
  .block-head b { color: var(--ink); font-size: 17px; }
  h3.sub { font-size: 15px; margin: 0; color: var(--ink); }
  details.items { margin-top: 14px; }
  .sheet-panel .big { font-size: 18px; margin: 6px 0 4px; }
  .sheet-panel .row2 { display: flex; gap: 10px; margin-top: 16px; }
  .sheet-panel .row2 .btn { margin-top: 0; }
  .method-link { border: 0; background: none; padding: 2px 0; color: var(--stamp); font-size: 14px; text-align: left; }

  /* ===== 回首頁按鈕、統計頁 ===== */
  .back-btn {
    display: none; margin: 0 0 6px -4px; padding: 4px 10px 4px 4px; border: 0; border-radius: 999px;
    background: rgba(255, 255, 255, .12); color: #fff; font-size: 14px;
  }
  .back-btn.show { display: inline-block; }
  .stat-row { display: grid; grid-template-columns: 5.5em 1fr auto; align-items: center; gap: 8px; padding: 6px 0; font-size: 15px; }
  .stat-row .bar { height: 10px; border-radius: 5px; background: #E8EEF6; overflow: hidden; }
  .stat-row .bar span { display: block; height: 100%; border-radius: 5px; background: var(--stamp); }
  .stat-row .val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat-row .val small { color: var(--muted); margin-left: 4px; }
  .form-top { display: flex; justify-content: space-between; align-items: center; }
  .form-top h2 { margin: 0; }
  .form-top button { border: 0; background: none; color: var(--muted); font-size: 15px; padding: 4px 0 4px 12px; }

  /* ===== 新增支出：付／分／還 三段 ===== */
  .form-sec { display: flex; align-items: center; gap: 10px; margin: 26px 0 0; color: var(--stamp); font-weight: 700; font-size: 16px; }
  .form-sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .repay-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .repay-row:last-child { border-bottom: 0; }
  .repay-row .check-row { margin: 0; }
  .repay-row .mini-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 32px; }
  .pick.mini { padding: 5px 10px; font-size: 14px; }
  .repay-row .repay-other { margin: 8px 0 0 32px; width: calc(100% - 32px); }
  details.more { margin-top: 22px; }
  details.more > summary { list-style: none; cursor: pointer; color: var(--stamp); font-size: 15px; padding: 6px 0; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more[open] > summary { color: var(--muted); }
</style>
</head>
<body>

<header class="ticket">
  <button class="back-btn" id="back-btn" onclick="goHome()">‹ 回首頁</button>
  <h1 id="trip-title">旅途分帳</h1>
  <p id="trip-sub">建立一趟旅程開始記帳</p>
</header>

<main>
  <!-- 連線有問題時才會出現：顯示可能原因和技術資訊 -->
  <div class="card" id="diag" style="display:none"></div>
  <!-- 頁面 0：建立旅程（還沒有旅程時才出現） -->
  <section class="page" id="page-setup">
    <div class="card account-card"></div>
    <div class="card" id="my-trips-card" style="display:none">
      <h2>我的旅程</h2>
      <div id="my-trips"></div>
    </div>
    <div class="card">
      <h2>建立新旅程</h2>
      <label for="setup-name">旅程名稱</label>
      <input id="setup-name" placeholder="例如：紐約波士頓 2027">
      <label for="setup-currency">主要貨幣（新增支出時預設的幣別）</label>
      <select id="setup-currency">
        <option value="TWD">新台幣 TWD</option>
        <option value="USD">美元 USD</option>
        <option value="JPY">日圓 JPY</option>
        <option value="EUR">歐元 EUR</option>
        <option value="KRW">韓元 KRW</option>
        <option value="GBP">英鎊 GBP</option>
      </select>
      <label for="setup-member">旅伴（第一個是你自己，其他人之後也可以用邀請連結自己加入）</label>
      <div class="row">
        <input id="setup-member" placeholder="輸入名字">
        <button class="small-btn" onclick="addSetupMember()">加入</button>
      </div>
      <div class="chip-list" id="setup-members"></div>
      <button class="btn" onclick="createTrip()">建立旅程</button>
    </div>
  </section>

  <!-- 加入旅程（打開邀請連結時出現） -->
  <section class="page" id="page-join">
    <div class="card" id="inapp-warning" style="display:none">
      <h2>⚠️ 請改用瀏覽器開啟</h2>
      <p class="hint" style="margin-top:0">你正在 LINE（或其他 App）內建的瀏覽器裡。這裡可以加入旅程，但<b>無法用 Google 登入</b>，資料也比較容易遺失。</p>
      <button class="btn" onclick="openInExternalBrowser()">用手機瀏覽器開啟</button>
      <p class="hint">如果按了沒反應：點右上角「⋯」或分享圖示，選「用 Safari 開啟」或「用預設瀏覽器開啟」。</p>
    </div>
    <div class="card account-card"></div>
    <div class="card">
      <h2 id="join-title">加入旅程</h2>

<!-- Firebase SDK（compat 版本，跟一般 script 一樣用，不需要 import） -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   第四步：Firebase 雲端同步
   ---------------------------------------------------------
   ① 把下面的 firebaseConfig 換成你自己專案的設定
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCte5NjBlIL_dItwT2jsBkPgU8r1NT9ivI",
  authDomain: "travel-expenses-7d1e7.firebaseapp.com",
  projectId: "travel-expenses-7d1e7",
  storageBucket: "travel-expenses-7d1e7.firebasestorage.app",
  messagingSenderId: "667683798377",
  appId: "1:667683798377:web:34e35f4876e8e0cbef51f8"
};

/* ---------------------------------------------------------
   Firestore 裡的資料結構：
   trips/{旅程id}
     name, baseCurrency, createdAt, createdBy(建立者 uid)
     members: [ { id, name, uid } ]   ← uid 是空的代表這個人還沒用手機加入
     memberUids: [ uid, ... ]         ← 誰可以讀寫這趟旅程（安全規則會檢查）
     rates: { USD: 32.5 }             ← 大家共用的最近匯率
   trips/{旅程id}/expenses/{支出id}    ← 跟第二步的格式一樣
   trips/{旅程id}/transfers/{還款id}   ← 跟第三步的格式一樣
   --------------------------------------------------------- */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// 開啟離線快取：沒網路時照樣能記帳，有網路後自動上傳
db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('離線快取無法開啟', e.code));

const CURRENT_TRIP_KEY = 'travelSplit_currentTrip';
const PENDING_JOIN_KEY = 'travelSplit_pendingJoin';   // 打開了邀請連結、但還沒完成加入的旅程   // 這支手機上次打開的旅程
const LAST_CURRENCY_KEY = 'travelSplit_lastCurrency';
const METHOD_KEY = 'travelSplit_payMethod';            // 這支手機上次用的付款方式
const METHOD_OTHER_KEY = 'travelSplit_payMethodOther'; // 上次「其他」填的文字
const PAY_METHODS = [
  { id: 'card', icon: '💳', name: '信用卡' },
  { id: 'cash', icon: '💵', name: '現金' },
  { id: 'other', icon: '✏️', name: '其他' }
];
// 列表上顯示的文字，例如「💳 信用卡」、「✏️ Apple Pay」
function methodLabel(e) {
  const m = PAY_METHODS.find(x => x.id === e.paymentMethod);
  if (!m) return '';
  if (m.id === 'other') return e.paymentMethodOther ? `${m.icon} ${e.paymentMethodOther}` : `${m.icon} 其他`;
  return `${m.icon} ${m.name}`;
}   // 這支手機習慣「現在換算」還是「之後再算」

let myUid = null;
let tripId = null;
let trip = null;
let expenses = [];
let transfers = [];
let rawExpenses = [], rawTransfers = [];   // 雲端讀到的原始資料（可能是舊格式）
let setupMembers = [];
let unsubscribers = [];   // 切換旅程時要停止監聽舊旅程
let joinTrip = null;      // 加入流程中，正在看的旅程

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function tripRef(id = tripId) { return db.collection('trips').doc(id); }

// Firestore 寫入失敗時統一提示（例如權限不足）
function onWriteError(e) {
  console.error(e);
  alert('雲端儲存失敗：' + (e.code || e.message));
}

// 找出「我」是名單上的哪一位
function myMember() {
  return trip ? trip.members.find(m => m.uid === myUid) : null;
}

/* ---------- 換頁 ---------- */
function showPage(id, opts = {}) {
  const prev = currentPage();
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.page === id));
  if (id === 'page-settle') renderSettle();
  if (id === 'page-stats') renderStats();
  // 首頁以外的頁面都顯示「回首頁」
  const home = isHomePage(id);
  document.getElementById('back-btn').classList.toggle('show', !home);
  // 讓手機的「上一頁」可以回首頁：離開首頁時記一筆瀏覽紀錄
  if (!opts.fromHistory && id !== prev && !home) {
    if (prev && !isHomePage(prev)) history.replaceState({ page: id }, '');
    else history.pushState({ page: id }, '');
  }
  window.scrollTo(0, 0);
}

function currentPage() {
  const el = document.querySelector('.page.active');
  return el ? el.id : null;
}
// 首頁：打開旅程時是支出列表；沒有打開旅程時是旅程列表
function isHomePage(id) {
  if (id === 'page-list') return true;
  if (id === 'page-setup') return !prevTripId;   // 從旅程裡點「切換旅程」進來的，不算首頁
  return false;
}

// 回首頁（左上角按鈕、新增頁的取消、手機的上一頁都會呼叫）
function goHome(opts = {}) {
  const page = currentPage();
  if (page === 'page-add' && formHasInput() && !confirm('這筆支出還沒儲存，確定離開？')) {
    if (opts.fromHistory) history.pushState({ page }, '');   // 取消離開：把紀錄補回去
    return;
  }
  if (page === 'page-join') { localStorage.removeItem(PENDING_JOIN_KEY); joinTrip = null; }
  if (trip) showPage('page-list', opts);
  else if (prevTripId) { const id = prevTripId; prevTripId = null; openTrip(id); }
  else showTripPicker();
}

function formHasInput() {
  return !!(document.getElementById('f-amount').value || document.getElementById('f-title').value ||
            document.getElementById('f-note').value || (draft && draft.photos && draft.photos.some(p => p.isNew)));
}

// 手機的上一頁：有面板開著就先關面板，否則回首頁
window.addEventListener('popstate', () => {
  const overlays = ['calc', 'repay-sheet', 'photo-viewer'].map(id => document.getElementById(id)).filter(el => el.classList.contains('show'));
  if (overlays.length) {
    overlays.forEach(el => el.classList.remove('show'));
    calc = null; repaySheet = null;
    history.pushState({ page: currentPage() }, '');
    return;
  }
  if (!isHomePage(currentPage())) goHome({ fromHistory: true });
});
function setHeader(title, sub) {
  document.getElementById('trip-title').textContent = title;
  document.getElementById('trip-sub').textContent = sub + (navigator.onLine ? '' : '・離線中，連線後會自動同步');
}

/* =========================================================
   啟動流程：登入 → 判斷要做什麼
   ========================================================= */
function startApp() {
  setHeader('旅途分帳', '連線中…');
  // 匿名登入：不用帳號密碼，Firebase 會給這支手機一個固定的 uid
  auth.onAuthStateChanged(async user => {
    if (!user) {
      auth.signInAnonymously().catch(e => {
        setHeader('旅途分帳', '無法連線');
        alert('登入失敗：' + (e.code || e.message) + '\n第一次使用需要網路。');
      });
      return;
    }
    myUid = user.uid;
    authResolved = true;
    hideDiag();
    renderAccount();
    if (switchingAccount) return;   // 正在切換帳號，等搬移完成再決定去哪一頁
    routeAfterLogin();
  });
}

// 登入後決定要打開哪一頁
async function routeAfterLogin() {
    // 邀請連結的旅程先記下來：中途去登入 Google、切換帳號，回來還能繼續加入
    const urlJoin = new URLSearchParams(location.search).get('join');
    if (urlJoin) {
      localStorage.setItem(PENDING_JOIN_KEY, urlJoin);
      history.replaceState(null, '', location.pathname);   // 把 ?join= 從網址拿掉
    }
    const joinId = localStorage.getItem(PENDING_JOIN_KEY);
    if (joinId) {
      await openJoin(joinId);
      return;
    }
    const saved = localStorage.getItem(CURRENT_TRIP_KEY);
    if (saved) openTrip(saved);
    else showTripPicker();
}

/* ---------- 旅程列表（沒有打開任何旅程時） ---------- */
let prevTripId = null;   // 從旅程裡點「切換旅程」時，記住原本的旅程，才能按「回首頁」回去

async function showTripPicker() {
  stopListening();
  tripId = null; trip = null; expenses = []; transfers = []; rawExpenses = []; rawTransfers = [];
  // 只是來看看旅程列表的話，重新整理後還是回到原本的旅程
  if (!prevTripId) localStorage.removeItem(CURRENT_TRIP_KEY);
  document.getElementById('tabs').classList.remove('show');
  setHeader('旅途分帳', prevTripId ? '切換或建立旅程' : '選擇或建立一趟旅程');
  renderSetupMembers();
  showPage('page-setup');
  try {
    // 查詢「我」參加的所有旅程
    const snap = await db.collection('trips').where('memberUids', 'array-contains', myUid).get();
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
    const card = document.getElementById('my-trips-card');
    card.style.display = list.length ? 'block' : 'none';
    document.getElementById('my-trips').innerHTML = list.map(t =>
      `<button class="trip-item" onclick="openTrip('${t.id}')"><span>${escapeHTML(t.name)}</span>` +
      `<small>${t.members.length} 人</small></button>`).join('');
  } catch (e) {
    console.error(e);
  }
}
function switchTrip() { prevTripId = tripId; showTripPicker(); }

/* ---------- 建立旅程 ---------- */
function addSetupMember() {
  const input = document.getElementById('setup-member');
  const name = input.value.trim();
  if (!name) return;
  if (setupMembers.includes(name)) { alert('這個名字已經加入了'); return; }
  setupMembers.push(name);
  input.value = '';
  input.focus();
  renderSetupMembers();
}
function removeSetupMember(i) {
  setupMembers.splice(i, 1);
  renderSetupMembers();
}
function renderSetupMembers() {
  document.getElementById('setup-members').innerHTML = setupMembers.map((n, i) =>
    `<span class="chip ${i === 0 ? 'me' : ''}">${escapeHTML(n)}${i === 0 ? '（我）' : ''}` +
    `<button onclick="removeSetupMember(${i})" aria-label="移除">✕</button></span>`
  ).join('');
}
function createTrip() {
  const name = document.getElementById('setup-name').value.trim();
  if (!name) { alert('請輸入旅程名稱'); return; }
  if (setupMembers.length < 1) { alert('請至少輸入你自己的名字'); return; }
  const id = db.collection('trips').doc().id;   // Firestore 產生的隨機 id，別人猜不到
  const data = {
    name,
    baseCurrency: document.getElementById('setup-currency').value,
    createdAt: Date.now(),
    createdBy: myUid,
    // 第一個人是自己，直接綁定 uid
    members: setupMembers.map((n, i) => ({ id: newId(), name: n, uid: i === 0 ? myUid : null })),
    memberUids: [myUid],
    rates: {}
  };
  tripRef(id).set(data).catch(onWriteError);
  setupMembers = [];
  document.getElementById('setup-name').value = '';
  openTrip(id);
}

/* ---------- 打開一趟旅程：開始即時監聽 ---------- */
function stopListening() {
  unsubscribers.forEach(fn => fn());
  unsubscribers = [];
}
function openTrip(id) {
  prevTripId = null;
  stopListening();
  tripId = id;
  trip = null; expenses = []; transfers = []; rawExpenses = []; rawTransfers = [];
  localStorage.setItem(CURRENT_TRIP_KEY, id);
  setHeader('旅途分帳', '讀取中…');

  // onSnapshot：資料一有變動（自己或旅伴改的），就會自動呼叫這裡
  unsubscribers.push(tripRef().onSnapshot(doc => {
    if (!doc.exists) {
      alert('找不到這趟旅程，可能已經被刪除');
      showTripPicker();
      return;
    }
    trip = doc.data();
    render();
  }, err => {
    console.error(err);
    alert('無法讀取這趟旅程：' + err.code);
    showTripPicker();
  }));

  unsubscribers.push(tripRef().collection('expenses').onSnapshot(snap => {
    rawExpenses = snap.docs.map(d => d.data());
    render();
  }, console.error));

  unsubscribers.push(tripRef().collection('transfers').onSnapshot(snap => {
    rawTransfers = snap.docs.map(d => d.data());
    render();
  }, console.error));
}

/* ---------- 加入旅程（打開邀請連結） ---------- */
async function openJoin(id) {
  try {
    const doc = await tripRef(id).get();
    if (!doc.exists) {
      localStorage.removeItem(PENDING_JOIN_KEY);
      alert('邀請連結無效或旅程已刪除'); showTripPicker(); return;
    }
    const data = doc.data();
    if (data.memberUids.includes(myUid)) {   // 已經加入過了（例如登入 Google 後，發現之前就加入過）
      localStorage.removeItem(PENDING_JOIN_KEY);
      openTrip(id); return;
    }
    joinTrip = { id, ...data };
    document.getElementById('tabs').classList.remove('show');
    setHeader(data.name, '加入旅程');
    document.getElementById('join-title').textContent = `加入「${data.name}」`;
    document.getElementById('inapp-warning').style.display = isInAppBrowser() ? 'block' : 'none';
    document.getElementById('join-members').innerHTML = data.members.map(m =>
      `<button class="join-pick" onclick="joinAs('${m.id}')">${escapeHTML(m.name)}` +
      `${m.uid ? '<small>已有手機加入</small>' : ''}</button>`).join('');
    showPage('page-join');
  } catch (e) {
    console.error(e);
    alert('無法讀取邀請：' + (e.code || e.message));
    showTripPicker();
  }
}
// 認領名單上的名字
function joinAs(memberId) {
  const m = joinTrip.members.find(x => x.id === memberId);
  // 已經被認領：可能是本人換了手機或清了瀏覽器資料，確認後讓他重新認領
  if (m.uid && !confirm(`「${m.name}」已經有手機加入了。\n如果是你換了手機或清除過資料，按確定繼續。`)) return;
  const members = joinTrip.members.map(x => x.id === memberId ? { ...x, uid: myUid } : x);
  finishJoin(members);
}
// 名單上沒有自己：新增
function joinAsNew() {
  const name = document.getElementById('join-new').value.trim();
  if (!name) return;
  if (joinTrip.members.some(m => m.name === name)) { alert('名單上已經有這個名字，請直接點選'); return; }
  finishJoin([...joinTrip.members, { id: newId(), name, uid: myUid }]);
}
function finishJoin(members) {
  const id = joinTrip.id;
  tripRef(id).update({
    members,
    memberUids: firebase.firestore.FieldValue.arrayUnion(myUid)
  }).then(() => { localStorage.removeItem(PENDING_JOIN_KEY); openTrip(id); }).catch(onWriteError);
  joinTrip = null;
}

// openExternalBrowser=1：LINE 的功能，從 LINE 點開這個連結時，會直接用手機瀏覽器開啟

// 是不是在 LINE、Facebook、Instagram 這類 App 內建的瀏覽器裡（Google 不允許在這裡登入）

async function deleteTrip() {
  if (!confirm(`確定要刪除「${trip.name}」和所有支出嗎？所有旅伴都會看不到，無法復原。`)) return;
  // Firestore 刪掉旅程不會自動刪掉裡面的支出，所以要一起刪
  const batch = db.batch();
  expenses.forEach(e => batch.delete(tripRef().collection('expenses').doc(e.id)));

/* =========================================================
   第二步：新增支出
   ---------------------------------------------------------
   金額一律用「最小單位的整數」儲存，避免小數誤差：
     USD 12.34 → 1234（美分）    TWD 350 → 350（元）
   每一筆 expense 的樣子：
   {
     id, title, category, date: '2027-02-10',
     currency: 'USD', amount: 9000,          ← 原幣金額（最小單位）
     payerId,                                ← 誰付的（各付各的時是 null）
     splitType: 'equal'（平均分攤）| 'custom'（自訂金額）| 'self'（各付各的，不產生欠款）,
     shares:     { 成員id: 原幣金額 },        ← 每人應分攤多少（原幣）
     （外幣不在記帳時換算，還錢時才決定用什麼貨幣、什麼匯率還）
     createdAt, updatedAt
   }
   ========================================================= */

// 各幣別有幾位小數
const CURRENCIES = {
  // decimals：儲存用的小數位數，全部統一 2 位（可以記到小數點後兩位）
  // showCents：'always' 永遠顯示兩位（US$12.00）；'auto' 整數時不顯示（NT$350、NT$350.50）
  TWD: { name: '新台幣', decimals: 2, showCents: 'auto', symbol: 'NT$' },
  USD: { name: '美元', decimals: 2, showCents: 'always', symbol: 'US$' },
  JPY: { name: '日圓', decimals: 2, showCents: 'auto', symbol: '¥' },
  EUR: { name: '歐元', decimals: 2, showCents: 'always', symbol: '€' },
  KRW: { name: '韓元', decimals: 2, showCents: 'auto', symbol: '₩' },
  GBP: { name: '英鎊', decimals: 2, showCents: 'always', symbol: '£' }
};
const CATEGORIES = [
  { id: 'food', icon: '🍽️', name: '餐飲' },
  { id: 'transport', icon: '🚇', name: '交通' },
  { id: 'stay', icon: '🏨', name: '住宿' },
  { id: 'ticket', icon: '🎟️', name: '門票' },
  { id: 'shopping', icon: '🛍️', name: '購物' },
  { id: 'other', icon: '📦', name: '其他' }
];

// 表單目前的狀態
// 注意：不能取名叫 form！在 onclick 裡，form 會被瀏覽器當成「按鈕所屬的 <form>」，變成 null
let draft = null;

/* ---------- 金額工具 ---------- */

// 把使用者輸入的文字轉成最小單位整數。完全不用浮點數運算。
// 回傳 null 代表格式錯誤。
function parseAmount(text, currency) {
  const d = CURRENCIES[currency].decimals;
  const t = String(text).trim().replace(/,/g, '');
  if (!/^\d+(\.\d*)?$/.test(t)) return null;
  const [intPart, fracPart = ''] = t.split('.');
  if (fracPart.length > d) return null;          // 例如台幣輸入了小數
  return parseInt(intPart + fracPart.padEnd(d, '0'), 10);
}

// 最小單位整數 → 顯示用文字（加千分位）
function formatAmount(minor, currency) {
  const c = CURRENCIES[currency];
  const neg = minor < 0;
  const abs = Math.abs(minor);
  const divisor = 10 ** c.decimals;
  const intStr = Math.floor(abs / divisor).toLocaleString('en-US');
  const cents = abs % divisor;
  const frac = (c.showCents === 'always' || cents) ? '.' + String(cents).padStart(c.decimals, '0') : '';
  return (neg ? '-' : '') + c.symbol + intStr + frac;
}

// 把 total 依照權重分配成整數，保證加總剛好等於 total（最大餘數法）
// 例：allocate(1000, [1,1,1]) → [334, 333, 333]
function allocate(total, weights) {
  const sum = weights.reduce((a, b) => a + b, 0);
  if (sum === 0) return weights.map(() => 0);
  const raw = weights.map(w => total * w / sum);
  const result = raw.map(Math.floor);
  let left = total - result.reduce((a, b) => a + b, 0);
  const order = raw.map((r, i) => ({ i, rem: r - Math.floor(r) })).sort((a, b) => b.rem - a.rem);
  for (let k = 0; k < left; k++) result[order[k].i] += 1;
  return result;
}

// 原幣金額 → 結算幣金額（都是最小單位整數）
function convertToBase(minor, currency, rate) {
  if (currency === trip.baseCurrency) return minor;
  const from = CURRENCIES[currency].decimals;
  const to = CURRENCIES[trip.baseCurrency].decimals;
  return Math.round(minor / 10 ** from * rate * 10 ** to);
}

function minorToText(minor, currency) {
  const d = CURRENCIES[currency].decimals;
  return (minor / 10 ** d).toFixed(d).replace(/\.00$/, '');
}

/* ---------- 舊資料相容 ----------
   早期版本台幣、日圓、韓元是存「整數元」，現在統一存「分」（×100）。
   沒有 v: 2 標記的舊資料，讀進來時自動換算，不需要改資料庫。 */
const LEGACY_DECIMALS = { TWD: 0, JPY: 0, KRW: 0 };
function legacyFactor(cur) { return 10 ** (2 - (LEGACY_DECIMALS[cur] ?? 2)); }
function scaleMap(obj, f) {
  if (!obj) return obj;
  const out = {};
  for (const [k, v] of Object.entries(obj)) out[k] = v * f;
  return out;
}
function normalizeExpense(e) {
  if (e.v >= 2) return e;
  const f = legacyFactor(e.currency), g = legacyFactor(trip.baseCurrency);
  return { ...e,
    amount: e.amount * f, shares: scaleMap(e.shares, f),
    baseAmount: e.baseAmount == null ? null : e.baseAmount * g, baseShares: scaleMap(e.baseShares, g) };
}
function normalizeTransfer(t) {
  const currency = t.currency || trip.baseCurrency;
  if (t.v >= 2) return { ...t, currency };
  return { ...t, currency, amount: t.amount * legacyFactor(currency) };
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function memberName(id) {
  const m = trip.members.find(m => m.id === id);
  return m ? m.name : '（已移除）';
}

function toggleParticipant(id) {

  else draft.participants.push(id);

  draft.participants.sort((a, b) => trip.members.findIndex(m => m.id === a) - trip.members.findIndex(m => m.id === b));

}

}

function setPersonal(v) {

// 選付款人；null = 各自付

}

function onCurrencyChange() {
  draft.currency = document.getElementById('f-currency').value;

/* ---------- 即時更新：分攤明細 ---------- */
function updateForm() {
  const cur = draft.currency;
  const base = trip.baseCurrency;
  const amount = parseAmount(document.getElementById('f-amount').value || '0', cur);

  renderFormRepay();
  // 分攤明細
  const box = document.getElementById('split-detail');
  const ids = draft.participants;
  if (ids.length === 0) {
    box.innerHTML = '<div class="hint">請至少選一個分攤的人</div>';
    return;
  }
  if (draft.splitMode === 'equal') {
    if (!amount) { box.innerHTML = ''; return; }
    const parts = allocate(amount, ids.map(() => 1));
    box.innerHTML = '<div class="hint">' + ids.map((id, i) =>
      `${escapeHTML(memberName(id))} ${formatAmount(parts[i], cur)}`).join('、') + '</div>';
  } else {
    // 自訂金額：每人一個輸入框。只重建一次，避免打字時輸入框跳掉
    const existing = [...box.querySelectorAll('input[data-mid]')].map(i => i.dataset.mid).join();
    if (existing !== ids.join()) {
      box.innerHTML = ids.map(id =>
        `<div class="custom-row"><span>${escapeHTML(memberName(id))}</span>` +
        `<div class="calc-wrap"><input inputmode="decimal" data-mid="${id}" value="${draft.customText[id] || ''}" placeholder="0" ` +
        `oninput="draft.customText['${id}']=this.value;updateRemain()">` +
        `<button class="calc-btn" onclick="openCalc(this.previousElementSibling, 'custom', '${id}')" aria-label="開啟計算機">${CALC_ICON}</button></div></div>`).join('') +
        '<div class="remain" id="remain"></div>';
    }
    updateRemain();
  }
}

// 自訂金額：顯示還差多少才等於總額
function updateRemain() {
  renderFormRepay();   // 「還」那一段的金額跟著更新
  const el = document.getElementById('remain');
  if (!el) return;
  const cur = draft.currency;
  const amount = parseAmount(document.getElementById('f-amount').value || '0', cur) || 0;
  let sum = 0;
  for (const id of draft.participants) {
    const v = parseAmount(draft.customText[id] || '0', cur);
    if (v === null) { el.textContent = `${memberName(id)} 的金額格式不對`; el.className = 'remain bad'; return; }
    sum += v;
  }
  const diff = amount - sum;
  if (diff === 0) { el.textContent = '✓ 金額剛好'; el.className = 'remain ok'; }
  else if (diff > 0) { el.textContent = `還有 ${formatAmount(diff, cur)} 沒分配`; el.className = 'remain bad'; }
  else { el.textContent = `超過總額 ${formatAmount(-diff, cur)}`; el.className = 'remain bad'; }
}

/* ---------- 儲存 ---------- */
function saveExpense() {
  const cur = draft.currency;
  const base = trip.baseCurrency;
  const amount = parseAmount(document.getElementById('f-amount').value, cur);
  if (!amount) {
    alert('請輸入金額（最多到小數點後兩位）');
    return;
  }
  const title = document.getElementById('f-title').value.trim() ||
    CATEGORIES.find(c => c.id === draft.category).name;
  const date = document.getElementById('f-date').value || todayStr();

  let ids = draft.participants;
  let personal = draft.personal;
  if (!personal && ids.length === 0) { alert('請至少選一個分攤的人'); return; }
  // 只有一個人分攤（付款人自己，或各自付只有一個人）＝ 個人開銷，統一存成同一種
  if (!personal && ids.length === 1 && (draft.selfPay || ids[0] === draft.payerId)) personal = true;
  const owner = personal ? (draft.personal ? draft.payerId : ids[0]) : null;

  // 算出每人分攤的原幣金額
  let parts;
  if (personal) {
    ids = [owner];
    parts = [amount];
  } else if (draft.splitMode === 'equal') {
    parts = allocate(amount, ids.map(() => 1));
  } else {
    parts = ids.map(id => parseAmount(draft.customText[id] || '0', cur));
    if (parts.some(p => p === null)) { alert('有人的金額格式不對'); return; }
    const sum = parts.reduce((a, b) => a + b, 0);
    if (sum !== amount) { alert('每個人的金額加起來要等於總額'); return; }
  }
  const shares = {};
  ids.forEach((id, i) => { shares[id] = parts[i]; });

  if (draft.photosLoading || draft.photosBusy) { alert('照片還在處理，請稍等一下再儲存'); return; }

  const now = Date.now();
  const expId = draft.editingId || newId();

  // 照片存在另一個 collection（photos），支出只記照片的 id。
  // 這樣打開支出列表時不會連同照片一起下載，速度才會快。
  const photoCol = tripRef().collection('photos');
  draft.photos.filter(p => p.isNew).forEach(p =>
    photoCol.doc(p.id).set({ id: p.id, expenseId: expId, data: p.data, createdAt: now, createdBy: myUid }).catch(onWriteError));
  draft.removedPhotoIds.forEach(id => photoCol.doc(id).delete().catch(onWriteError));

  const data = {
    title, category: draft.category, date,
    note: document.getElementById('f-note').value.trim(),
    photoIds: draft.photos.map(p => p.id),
    currency: cur, amount,
    rate: null, baseAmount: null, baseShares: null,   // 舊版的換算欄位，不再使用
    payerId: personal ? owner : (draft.selfPay ? null : draft.payerId),
    paymentMethod: draft.method,
    paymentMethodOther: draft.method === 'other' ? document.getElementById('f-method-other').value.trim() : '',
    splitType: personal ? 'personal' : (draft.selfPay ? 'self' : draft.splitMode),   // equal / custom / self（各自付）/ personal（個人開銷）
    splitMode: draft.splitMode,                              // 各自付時用平均還是自訂金額
    shares,
    v: 2,   // 資料格式版本：金額統一存到小數點後兩位
    updatedAt: now
  };

  const col = tripRef().collection('expenses');
  if (draft.editingId) {
    // update 只改這些欄位，保留 createdAt、createdBy
    col.doc(draft.editingId).update(data).catch(onWriteError);
  } else {
    col.doc(expId).set({ id: expId, createdAt: now, createdBy: myUid, ...data }).catch(onWriteError);
  }

  // 同步這筆支出的逐筆還款紀錄
  syncExpenseRepayments({ id: expId, ...data }, draft.repay);

  // 記住這次的幣別（只存在這支手機）
  localStorage.setItem(LAST_CURRENCY_KEY, cur);
  if (draft.method) localStorage.setItem(METHOD_KEY, draft.method); else localStorage.removeItem(METHOD_KEY);
  if (draft.method === 'other') localStorage.setItem(METHOD_OTHER_KEY, data.paymentMethodOther);
  // 不用等雲端回應：有離線快取，畫面會立刻更新；沒網路時也不會卡住
  showPage('page-list');
}

function deleteExpense() {
  if (!draft.editingId) return;
  if (!confirm('確定刪除這筆支出？')) return;
  const e = expenses.find(x => x.id === draft.editingId);
  (e && e.photoIds || []).forEach(id => tripRef().collection('photos').doc(id).delete().catch(onWriteError));
  transfers.filter(t => t.expenseId === draft.editingId)
    .forEach(t => tripRef().collection('transfers').doc(t.id).delete().catch(onWriteError));
  tripRef().collection('expenses').doc(draft.editingId).delete().catch(onWriteError);
  showPage('page-list');
}

/* ---------- 支出列表 ---------- */
// 個人開銷：新版存成 personal；舊資料只有一個人分攤、而且是付款人自己（或各付各的只有一人）也算
function isPersonal(e) {
  if (e.splitType === 'personal') return true;
  const ids = Object.keys(e.shares || {});
  return ids.length === 1 && (e.splitType === 'self' || ids[0] === e.payerId);
}
function personalOwner(e) { return e.payerId || Object.keys(e.shares)[0]; }

// 加總：各幣別分開加，例如「NT$12,340 ＋ US$450.00」
function sumExpenses(list) {
  const byCur = {};
  for (const e of list) byCur[e.currency] = (byCur[e.currency] || 0) + e.amount;
  const order = Object.keys(byCur).sort((x, y) => (y === trip.baseCurrency) - (x === trip.baseCurrency));
  return { byCur, text: order.map(c => formatAmount(byCur[c], c)).join(' ＋ ') || formatAmount(0, trip.baseCurrency) };
}

function renderList() {
  const box = document.getElementById('expense-list');
  if (!trip) return;
  if (expenses.length === 0) {
    box.innerHTML = '<div class="empty"><strong>還沒有任何支出</strong>點下方的 ＋ 記下第一筆</div>';
    return;
  }
  const base = trip.baseCurrency;
  const sum = sumExpenses(expenses.filter(e => !isPersonal(e)));   // 旅程總花費不含個人開銷
  const personalSum = sumExpenses(expenses.filter(isPersonal));

  // 新的日期在上面；同一天內新的在上面
  const sorted = [...expenses].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const groups = {};
  sorted.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });

  let html = `<div class="total-bar"><span>旅程總花費</span><strong style="text-align:right">${sum.text}</strong></div>`;
  if (Object.keys(personalSum.byCur).length) {
    html += `<div class="hint" style="text-align:right;margin:6px 4px 0">另有個人開銷 ${personalSum.text}（不算在總花費內）</div>`;
  }
  for (const [date, list] of Object.entries(groups)) {
    const [y, m, d] = date.split('-');
    const shared = list.filter(e => !isPersonal(e));
    const own = list.filter(isPersonal);
    const dayText = [shared.length ? sumExpenses(shared).text : '', own.length ? `個人 ${sumExpenses(own).text}` : ''].filter(Boolean).join('・');
    html += `<div class="day-head"><span>${Number(m)}/${Number(d)}</span><span>${dayText}</span></div>`;
    html += list.map(e => {
      const cat = CATEGORIES.find(c => c.id === e.category) || CATEGORIES[5];
      const n = Object.keys(e.shares).length;
      return `<button class="exp" onclick="openEditForm('${e.id}')">
        <span class="icon">${cat.icon}</span>
        <span class="mid"><div class="title">${escapeHTML(e.title)}</div>
          <div class="who">${isPersonal(e) ? `${escapeHTML(memberName(personalOwner(e)))} 個人${methodLabel(e) ? `（${escapeHTML(methodLabel(e))}）` : ''}` : e.splitType === 'self' ? `各付各的${methodLabel(e) ? `（${escapeHTML(methodLabel(e))}）` : ''}・${n} 人` : `${escapeHTML(memberName(e.payerId))} 付款${methodLabel(e) ? `（${escapeHTML(methodLabel(e))}）` : ''}・${n} 人分攤`}${isFullySettled(e) ? '・<span class="settled-tag">✓已結清</span>' : ''}${e.note ? '・📝' : ''}${(e.photoIds || []).length ? `・📷${e.photoIds.length}` : ''}</div></span>
        <span class="money">${formatAmount(e.amount, e.currency)}</span>
      </button>`;
    }).join('');
  }
  box.innerHTML = html;
}

/* =========================================================
   第三步：結算（依幣別分區）
   ---------------------------------------------------------
   每種貨幣一個區塊，各自計算，不互相換算：
     總花費 → 未還加總（兩人之間，可一次結清）→ 逐項（可個別按已還）
   外幣欠款在還錢的時候，才決定用什麼貨幣、什麼匯率還。

   還款紀錄（transfers）的格式：
   { id, expenseId, fromId, toId, amount, currency,   ← 還的是哪筆支出、原幣金額
     method, methodOther,                             ← 還款方式（可空）
     paidCurrency, paidAmount, paidRate,              ← 實際用什麼貨幣還（空的 = 用原幣）
     date, createdAt, createdBy, v: 2 }
   ========================================================= */
const openSections = {};   // 收合區塊目前是開還是關（畫面更新時保持原狀）

// 這趟旅程用到的貨幣，結算幣別排第一
function tripCurrencies(source = expenses) {
  const list = [];
  [...source].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => { if (!list.includes(e.currency)) list.push(e.currency); });
  return list.sort((x, y) => (y === trip.baseCurrency) - (x === trip.baseCurrency));
}

// 一筆支出裡，誰欠付款人多少（原幣）
function expenseDebts(e) {
  if (e.splitType === 'self' || !e.payerId || isPersonal(e)) return [];
  return Object.entries(e.shares)
    .filter(([id, v]) => id !== e.payerId && v > 0)
    .map(([id, v]) => ({ fromId: id, toId: e.payerId, amount: v, currency: e.currency }));
}
function repaymentOf(expenseId, fromId) {
  return transfers.find(t => t.expenseId === expenseId && t.fromId === fromId);
}
function isFullySettled(e) {
  const debts = expenseDebts(e);
  return debts.length > 0 && debts.every(d => repaymentOf(e.id, d.fromId));
}

// 某個貨幣所有還沒還的項目
function unpaidDebts(currency) {
  const out = [];
  for (const e of expenses) {
    if (e.currency !== currency) continue;
    for (const d of expenseDebts(e)) if (!repaymentOf(e.id, d.fromId)) out.push({ ...d, expenseId: e.id });
  }
  return out;
}

// 兩人之間的未還加總：A 欠 B 的和 B 欠 A 的互相抵銷
function pairSummary(currency) {
  const owe = {};
  for (const d of unpaidDebts(currency)) {
    const k = d.fromId + '|' + d.toId;
    owe[k] = (owe[k] || 0) + d.amount;
  }
  const seen = new Set(), out = [];
  for (const k of Object.keys(owe)) {
    const [a, b] = k.split('|');
    const pk = [a, b].sort().join('|');
    if (seen.has(pk)) continue;
    seen.add(pk);
    const net = (owe[a + '|' + b] || 0) - (owe[b + '|' + a] || 0);
    if (net >= 0) out.push({ fromId: a, toId: b, amount: net });
    else out.push({ fromId: b, toId: a, amount: -net });
  }
  return out.sort((x, y) => y.amount - x.amount);
}

// 每個人在每種貨幣：付了多少、實際花了多少
function spendingByPerson() {
  const r = {};
  const add = (id, c, field, v) => {
    r[id] = r[id] || {};
    r[id][c] = r[id][c] || { paid: 0, spent: 0, personal: 0 };
    r[id][c][field] += v;
  };
  for (const e of expenses) {
    if (isPersonal(e)) { add(personalOwner(e), e.currency, 'personal', e.amount); continue; }
    for (const [id, v] of Object.entries(e.shares)) {
      add(id, e.currency, 'spent', v);
      if (e.splitType === 'self') add(id, e.currency, 'paid', v);
    }
    if (e.splitType !== 'self' && e.payerId) add(e.payerId, e.currency, 'paid', e.amount);
  }
  return r;
}

// 收合區塊；defaultOpen = 第一次顯示時要不要展開
function section(key, title, right, body, defaultOpen) {
  const open = openSections[key] === undefined ? defaultOpen : openSections[key];
  return `<details class="items" ${open ? 'open' : ''} ontoggle="openSections['${key}'] = this.open">
    <summary><h3 class="sub">${title}</h3><span class="hint" style="margin:0">${right} <span class="arrow">▶</span></span></summary>
    ${body}</details>`;
}

function renderSettle() {
  const box = document.getElementById('settle-box');
  if (!trip) return;
  if (expenses.length === 0) {
    box.innerHTML = '<div class="empty"><strong>還沒有支出可以結算</strong>先記幾筆帳再回來看</div>';
    return;
  }
  const sharedExp = expenses.filter(e => !isPersonal(e));
  if (!sharedExp.length) {
    box.innerHTML = '<div class="empty"><strong>沒有共同開銷</strong>目前只有個人開銷，不需要結算</div>';
    return;
  }
  let html = tripCurrencies(sharedExp).map(renderCurrencyBlock).join('');
  if (transfers.length) html += `<div class="card" style="padding-top:2px">${section('history', '已還款紀錄', `${transfers.length} 筆`, renderHistory(), false)}</div>`;
  html += '<button class="btn ghost" onclick="shareSettle()">分享結算結果</button>';
  box.innerHTML = html;
}

function renderCurrencyBlock(c) {
  const list = expenses.filter(e => e.currency === c && !isPersonal(e));
  const total = list.reduce((a, e) => a + e.amount, 0);
  const pairs = pairSummary(c);

  // 未還加總
  const pairHtml = pairs.length ? pairs.map(p => `<div class="transfer">
      <div class="flow">${p.amount
        ? `<b>${escapeHTML(memberName(p.fromId))}</b> 還要給 <b>${escapeHTML(memberName(p.toId))}</b><span class="amt">${formatAmount(p.amount, c)}</span>`
        : `<b>${escapeHTML(memberName(p.fromId))}</b> 和 <b>${escapeHTML(memberName(p.toId))}</b> 互相抵銷<span class="detail">金額剛好一樣，標記後就兩清</span>`}</div>
      <button class="done-btn" onclick="settlePair('${c}','${p.fromId}','${p.toId}')">一次結清</button>
    </div>`).join('') : '<div class="all-clear">✓ 都還清了</div>';

  // 逐項
  const withDebts = list.filter(e => expenseDebts(e).length)
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  let unpaidCount = 0;
  const itemsHtml = withDebts.length ? withDebts.map(e => {
    const rows = expenseDebts(e).map(d => {
      const t = repaymentOf(e.id, d.fromId);
      if (!t) unpaidCount++;
      const label = t ? repayLabel(t) : '';
      const editBtn = t && t.method !== 'offset'
        ? `<br><button class="method-link" onclick="editRepayMethod('${t.id}')">${label ? escapeHTML(label) + ' ✎' : '＋ 還款方式'}</button>`
        : (t ? `<br><span class="detail">${escapeHTML(label)}</span>` : '');
      return `<div class="item-debt ${t ? 'paid' : ''}">
        <span class="txt"><span class="line">${escapeHTML(memberName(d.fromId))} 應還 ${escapeHTML(memberName(d.toId))} ${formatAmount(d.amount, c)}</span>${editBtn}</span>
        ${t
          ? `<button class="undo-btn" onclick="undoItemPaid('${e.id}','${d.fromId}')">✓ 已還</button>`
          : `<button class="done-btn" onclick="markItemPaid('${e.id}','${d.fromId}')">已還</button>`}
      </div>`;
    }).join('');
    const [, m, dd] = e.date.split('-');
    return `<div class="item-exp">
      <div class="head"><span>${escapeHTML(e.title)}</span><small>${Number(m)}/${Number(dd)}・${formatAmount(e.amount, c)}</small></div>
      ${rows}</div>`;
  }).join('') : '<p class="hint">這個貨幣沒有需要還的項目（都是各付各的）</p>';

  return `<div class="card">
    <div class="block-head"><h2>${CURRENCIES[c].name} ${c}</h2><span>總花費 <b>${formatAmount(total, c)}</b></span></div>
    <h3 class="sub" style="margin-top:16px">未還加總</h3>
    ${pairHtml}
    ${section('items-' + c, '逐項', unpaidCount ? `${unpaidCount} 項未還` : '全部已還', itemsHtml, true)}
  </div>`;
}

function renderSpending() {
  const sp = spendingByPerson();
  const curs = tripCurrencies();
  return trip.members.map(m => {
    const mine = sp[m.id] || {};
    const paid = curs.filter(c => mine[c] && mine[c].paid).map(c => formatAmount(mine[c].paid, c)).join(' ＋ ') || '0';
    const spent = curs.filter(c => mine[c] && mine[c].spent).map(c => formatAmount(mine[c].spent, c)).join(' ＋ ') || '0';
    const own = curs.filter(c => mine[c] && mine[c].personal).map(c => formatAmount(mine[c].personal, c)).join(' ＋ ');
    return `<div class="bal"><div><div class="name">${escapeHTML(m.name)}</div>
      <div class="detail">共同開銷：付了 ${paid}・分攤 ${spent}</div>
      ${own ? `<div class="detail">個人開銷：${own}</div>` : ''}</div></div>`;
  }).join('');
}

function renderHistory() {
  return [...transfers].sort((a, b) => b.createdAt - a.createdAt).map(t => {
    const exp = expenses.find(e => e.id === t.expenseId);
    const label = repayLabel(t);
    const editable = t.expenseId && t.method !== 'offset';
    return `<div class="transfer paid">
      <div class="flow">${escapeHTML(memberName(t.fromId))} 給 ${escapeHTML(memberName(t.toId))}
        <span class="amt">${formatAmount(t.amount, t.currency)}</span>
        <span class="detail">${t.date}${exp ? `・${escapeHTML(exp.title)}` : (t.expenseId ? '' : '・舊版紀錄（不計入結算）')}</span>
        ${editable ? `<button class="method-link" onclick="editRepayMethod('${t.id}')">${label ? escapeHTML(label) + ' ✎' : '＋ 還款方式'}</button>`
                   : (label ? `<span class="detail">${escapeHTML(label)}</span>` : '')}</div>
      <button class="undo-btn" onclick="undoPaid('${t.id}')">取消</button>
    </div>`;
  }).join('');
}

function undoPaid(id) {
  if (!confirm('取消這筆還款紀錄？')) return;
  tripRef().collection('transfers').doc(id).delete().catch(onWriteError);
}

// 產生一段文字，可以直接貼到 LINE 群組
async function shareSettle() {
  const shared = expenses.filter(e => !isPersonal(e));
  const curs = tripCurrencies(shared);
  let text = `【${trip.name}】結算\n旅程總花費 ${sumExpenses(shared).text}\n`;
  for (const c of curs) {
    const pairs = pairSummary(c).filter(p => p.amount > 0);
    text += `\n〔${CURRENCIES[c].name} ${c}〕\n`;
    text += pairs.length
      ? pairs.map(p => `${memberName(p.fromId)} → ${memberName(p.toId)}：${formatAmount(p.amount, c)}`).join('\n')
      : '都還清了！';
    text += '\n';
  }
  const sp = spendingByPerson();
  const allCurs = tripCurrencies();
  text += '\n每人分攤的共同開銷：\n' + trip.members.map(m => {
    const mine = sp[m.id] || {};
    const own = allCurs.filter(c => mine[c] && mine[c].personal).map(c => formatAmount(mine[c].personal, c)).join(' ＋ ');
    return `${m.name} ` + (curs.filter(c => mine[c] && mine[c].spent).map(c => formatAmount(mine[c].spent, c)).join(' ＋ ') || '0') +
      (own ? `（另有個人開銷 ${own}）` : '');
  }).join('\n');

  try {
    if (navigator.share) {           // 手機：跳出分享選單（可選 LINE）
      await navigator.share({ text });
    } else {                         // 電腦：複製到剪貼簿
      await navigator.clipboard.writeText(text);
      alert('已複製，可以貼到聊天室');
    }
  } catch (e) {
    if (e.name !== 'AbortError') prompt('請手動複製：', text);   // 使用者按取消不算錯誤
  }
}


/* =========================================================
   內建計算機
   ---------------------------------------------------------
   點金額欄位 → 下方跳出計算機 → 按「確定」把結果填回欄位。
   不用 eval()（有安全疑慮），自己寫一個簡單的四則運算：
   先算 × ÷，再算 + −。
   ========================================================= */
let calc = null;   // { input, kind: 'amount'|'custom', memberId, expr }
const CALC_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="3" rx=".5"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>`;

function openCalc(input, kind, memberId) {
  if (!draft) return;
  input.blur();   // 避免手機跳出系統鍵盤
  calc = { input, kind, memberId, expr: input.value.replace(/[^\d.]/g, '').replace(/\.$/, '') };
  document.getElementById('calc-label').textContent =
    kind === 'amount' ? `總金額（${draft.currency}）` : `${memberName(memberId)} 要付（${draft.currency}）`;
  renderCalcQuick();
  renderCalc();
  document.getElementById('calc').classList.add('show');
}

function closeCalc() {
  document.getElementById('calc').classList.remove('show');
  calc = null;
}

// 按鍵輸入
function calcKey(k) {
  if (!calc) return;
  let e = calc.expr;
  const last = e.slice(-1);
  const isOp = c => '+−×÷'.includes(c);
  if (k === 'C') e = '';
  else if (k === 'back') e = e.slice(0, -1);
  else if (isOp(k)) {
    if (e === '') return;                 // 開頭不能是運算符號
    e = isOp(last) ? e.slice(0, -1) + k : e + k;   // 連按兩個符號：換成新的
  } else if (k === '.') {
    const curNum = e.split(/[+−×÷]/).pop();
    if (curNum.includes('.')) return;     // 同一個數字只能有一個小數點
    e += curNum === '' ? '0.' : '.';
  } else {
    const curNum = e.split(/[+−×÷]/).pop();
    if (curNum === '0') e = e.slice(0, -1);   // 避免 007
    e += k;
  }
  calc.expr = e;
  renderCalc();
}

// 把算式算出答案；算式不完整或除以 0 時回傳 null
function evalExpr(expr) {
  const tokens = expr.match(/\d+\.?\d*|\.\d+|[+−×÷]/g);
  if (!tokens) return null;
  if ('+−×÷'.includes(tokens[tokens.length - 1])) tokens.pop();   // 結尾的符號先忽略
  if (!tokens.length) return null;
  // 第一輪：處理 × ÷
  const stack = [parseFloat(tokens[0])];
  for (let i = 1; i < tokens.length; i += 2) {
    const op = tokens[i], n = parseFloat(tokens[i + 1]);
    if (op === '×') stack[stack.length - 1] *= n;
    else if (op === '÷') {
      if (n === 0) return null;
      stack[stack.length - 1] /= n;
    } else stack.push(op, n);
  }
  // 第二輪：處理 + −
  let result = stack[0];
  for (let i = 1; i < stack.length; i += 2) {
    result = stack[i] === '+' ? result + stack[i + 1] : result - stack[i + 1];
  }
  return result;
}

// 四捨五入到這個幣別的小數位數，回傳文字（例如 "1262" 或 "12.35"）
function roundForCurrency(value, currency) {
  const d = CURRENCIES[currency].decimals;
  return (Math.round(value * 10 ** d) / 10 ** d).toFixed(d);
}

function renderCalc() {
  const cur = draft.currency;
  document.getElementById('calc-expr').textContent = calc.expr;
  const v = evalExpr(calc.expr);
  const note = document.getElementById('calc-note');
  const res = document.getElementById('calc-result');
  if (calc.expr === '') { res.textContent = '0'; note.textContent = ''; return; }
  if (v === null) { res.textContent = '—'; note.textContent = /÷0(?![.\d])/.test(calc.expr) ? '不能除以 0' : ''; return; }
  const text = roundForCurrency(v, cur);
  res.textContent = formatAmount(parseAmount(text.replace('-', ''), cur) * (v < 0 ? -1 : 1), cur);
  note.textContent = Math.abs(parseFloat(text) - v) > 1e-9 ? '已四捨五入' : '';
}

// 快速按鈕：只在「各付各的」出現
function renderCalcQuick() {
  const box = document.getElementById('calc-quick');
  box.innerHTML = '';
  if (calc.kind !== 'custom') return;
  const cur = draft.currency;
  const toText = v => minorToText(v, cur);
  const total = parseAmount(document.getElementById('f-amount').value || '0', cur) || 0;
  if (!total) return;
  const n = draft.participants.length;
  // 其他人已經填的金額（不含這個人）
  let others = 0;
  for (const id of draft.participants) {
    if (id === calc.memberId) continue;
    others += parseAmount(draft.customText[id] || '0', cur) || 0;
  }
  const remain = total - others;
  const chips = [];
  chips.push(`<button onclick="calcInsert('${toText(total)}÷${n}')">平分 ${formatAmount(Math.round(total / n), cur)}</button>`);
  if (remain > 0 && others > 0) chips.push(`<button onclick="calcInsert('${toText(remain)}')">剩下的 ${formatAmount(remain, cur)}</button>`);
  chips.push(`<button onclick="calcInsert('${toText(total)}')">總額 ${formatAmount(total, cur)}</button>`);
  box.innerHTML = chips.join('');
}

// 快速按鈕：算式最後是符號就接在後面（例如 500+ 再按平分），否則直接取代
function calcInsert(text) {
  const plain = text.replace(/\.0+(?=$|÷)/g, '');   // 3786.00 → 3786，比較好讀
  calc.expr = /[+−×÷]$/.test(calc.expr) ? calc.expr + plain : plain;
  renderCalc();
}

function calcConfirm() {
  if (!calc) return;
  const cur = draft.currency;
  let text = '';
  if (calc.expr !== '') {
    const v = evalExpr(calc.expr);
    if (v === null) { alert('算式不完整'); return; }
    if (v < 0) { alert('金額不能是負數'); return; }
    text = roundForCurrency(v, cur);
    text = text.replace(/\.0+$/, '');   // 12.00 顯示成 12
  }
  const { input, kind, memberId } = calc;
  input.value = text;
  closeCalc();
  if (kind === 'amount') updateForm();
  else { draft.customText[memberId] = text; updateRemain(); }
}

// 電腦上也能用鍵盤操作計算機
document.addEventListener('keydown', e => {
  if (!calc) return;
  const map = { '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', '.': '.', 'Backspace': 'back', 'Delete': 'C' };
  if (/^[0-9]$/.test(e.key)) calcKey(e.key);
  else if (map[e.key]) calcKey(map[e.key]);
  else if (e.key === 'Enter' || e.key === '=') calcConfirm();
  else if (e.key === 'Escape') closeCalc();
  else return;
  e.preventDefault();
});


/* =========================================================
   照片
   ---------------------------------------------------------
   手機照片動輒 3–5 MB，Firestore 一筆資料最多 1 MB，
   所以上傳前先在手機上縮小（最長邊 1280 像素）、壓成 JPEG，
   通常只剩 150–300 KB，收據上的字還是看得清楚。
   ========================================================= */
const MAX_PHOTOS = 4;
const MAX_PHOTO_CHARS = 700000;   // 壓縮後的文字長度上限（約 500 KB），留空間給 1 MB 限制

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let maxSide = 1280, quality = 0.7;
      for (let attempt = 0; attempt < 8; attempt++) {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * scale);
        const h = Math.round(img.naturalHeight * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';            // 透明背景的圖片（PNG 截圖）改成白底
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const data = canvas.toDataURL('image/jpeg', quality);
        if (data.length <= MAX_PHOTO_CHARS) { resolve(data); return; }
        // 還是太大：先降畫質，再縮尺寸
        if (quality > 0.5) quality -= 0.1;
        else maxSide = Math.round(maxSide * 0.8);
      }
      reject(new Error('圖片太大，壓縮不下來'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這個檔案，請換一張圖片')); };
    img.src = url;
  });
}

async function addPhotos(fileList) {
  const files = [...fileList];
  const room = MAX_PHOTOS - draft.photos.length;
  if (files.length > room) alert(`最多 ${MAX_PHOTOS} 張，只會加入前 ${room} 張`);
  draft.photosBusy = true;
  renderPhotos();
  for (const f of files.slice(0, room)) {
    try {
      draft.photos.push({ id: newId(), data: await compressImage(f), isNew: true });
    } catch (e) {
      alert(e.message);
    }
    renderPhotos();
  }
  draft.photosBusy = false;
  renderPhotos();
}

function removePhoto(i) {
  if (!confirm('刪除這張照片？（按儲存後才會真的刪除）')) return;
  const [p] = draft.photos.splice(i, 1);
  if (!p.isNew) draft.removedPhotoIds.push(p.id);
  renderPhotos();
}

// 編輯支出時，從雲端讀回照片
function loadPhotos(e) {
  const ids = e.photoIds || [];
  if (!ids.length) { renderPhotos(); return; }
  const editingId = e.id;
  draft.photosLoading = true;
  renderPhotos();
  Promise.all(ids.map(id => tripRef().collection('photos').doc(id).get()))
    .then(docs => {
      if (!draft || draft.editingId !== editingId) return;   // 已經離開這筆了
      draft.photos = docs.filter(d => d.exists).map(d => ({ id: d.id, data: d.data().data, isNew: false }));
    })
    .catch(err => { console.error(err); alert('照片讀取失敗：' + (err.code || err.message)); })
    .finally(() => {
      if (!draft || draft.editingId !== editingId) return;
      draft.photosLoading = false;
      renderPhotos();
    });
}

function renderPhotos() {
  const box = document.getElementById('f-photos');
  if (draft.photosLoading) { box.innerHTML = '<div class="hint" style="grid-column:1/-1">照片載入中…</div>'; return; }
  let html = draft.photos.map((p, i) =>
    `<div class="thumb"><img src="${p.data}" alt="照片 ${i + 1}" onclick="viewPhoto(${i})">` +
    `<button class="rm" onclick="removePhoto(${i})" aria-label="刪除照片">✕</button></div>`).join('');
  if (draft.photosBusy) html += '<div class="add-photo">處理中…</div>';
  else if (draft.photos.length < MAX_PHOTOS)
    html += `<button class="add-photo" onclick="document.getElementById('f-photo-input').click()"><span>📷</span>加照片</button>`;
  box.innerHTML = html;
}

function viewPhoto(i) {
  document.getElementById('viewer-img').src = draft.photos[i].data;
  document.getElementById('photo-viewer').classList.add('show');
}
function closeViewer() {
  document.getElementById('photo-viewer').classList.remove('show');
  document.getElementById('viewer-img').src = '';
}


/* =========================================================
   自動抓匯率
   ---------------------------------------------------------
   資料來源：fawazahmed0 Exchange API（免費、免註冊、每天更新）
     https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@2027-02-10/v1/currencies/usd.min.json
     → { "date": "2027-02-10", "usd": { "twd": 32.45, "jpy": 150.2, ... } }
   主要網址失敗時改用備援網址（官方建議一定要做）。
   這是國際市場中間價，不是台灣銀行的牌告匯率。
   現在只用在「已還」面板：外幣欠款改用其他貨幣還時，幫忙帶入參考匯率。
   ========================================================= */
const RATE_EARLIEST = '2024-03-02';   // 這個來源最早的資料日期
const rateCache = {};                 // 同一天同幣別只抓一次

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// 取得 1 單位 from 幣別 = 多少 to 幣別；回傳 { rate, date(實際資料日期) }
// 快取存的是「請求本身」，同時重複呼叫也只會真的連線一次
function getRate(from, to, date) {
  const key = `${from}-${to}-${date}`;
  if (!rateCache[key]) {
    rateCache[key] = requestRate(from, to, date).catch(e => { delete rateCache[key]; throw e; });
  }
  return rateCache[key];
}

async function requestRate(from, to, date) {
  const f = from.toLowerCase(), t = to.toLowerCase();
  const urls = d => [
    `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${d}/v1/currencies/${f}.min.json`,
    `https://${d}.currency-api.pages.dev/v1/currencies/${f}.min.json`
  ];
  // 今天或未來的日期可能還沒有資料，就改抓最新的
  const tries = [...urls(date)];
  if (date >= todayStr()) tries.push(...urls('latest'));
  let lastErr;
  for (const url of tries) {
    try {
      const data = await fetchJSON(url);
      const rate = data[f] && data[f][t];
      if (!rate) throw new Error('沒有這個幣別的資料');
      return { rate: parseFloat(rate.toPrecision(6)), date: data.date || date };
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}


/* =========================================================
   Google 登入（跨裝置同步）
   ---------------------------------------------------------
   沒登入時是「訪客」（匿名登入），身分只綁在這台裝置的瀏覽器。
   用 Google 登入後，身分綁在 Google 帳號上，任何裝置登入同一個帳號，
   都會是同一個 uid，看得到同樣的旅程。

   兩種情況：
   A. 這個 Google 帳號第一次使用：把訪客身分「升級」成 Google 帳號
      （linkWithPopup），uid 不變，原本的旅程直接保留。
   B. 這個 Google 帳號已經在別台裝置用過：切換成那個帳號，
      並把這台裝置上訪客身分參加的旅程，一起搬到 Google 帳號底下。
   ========================================================= */
let switchingAccount = false;

const GOOGLE_ICON = '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';

function renderAccount() {
  const u = auth.currentUser;
  if (!u) return;
  let html;
  if (u.isAnonymous) {
    html = `<h2>帳號</h2>
      <p class="hint" style="margin-top:0">目前是<b>訪客</b>：旅程只存在這台裝置的瀏覽器。用 Google 登入後，手機、平板、電腦都能看到同樣的紀錄。<br>先登入或先加入旅程都可以，順序不影響。</p>
      <button class="google-btn" onclick="loginWithGoogle()">${GOOGLE_ICON}用 Google 登入</button>`;
  } else {
    const email = u.email || (u.providerData[0] && u.providerData[0].email) || '';
    html = `<h2>帳號</h2>
      <div class="account-row">
        <div class="who-am-i">已用 Google 登入<small>${escapeHTML(email)}</small></div>
        <button class="small-btn" style="background:#fff;color:var(--muted);border:1px solid var(--line)" onclick="logout()">登出</button>
      </div>`;
  }
  document.querySelectorAll('.account-card').forEach(el => { el.innerHTML = html; });
}

async function loginWithGoogle() {
  if (isInAppBrowser()) {
    if (confirm('LINE 等 App 內建的瀏覽器無法使用 Google 登入。\n要改用手機瀏覽器開啟嗎？')) openInExternalBrowser();
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });   // 每次都讓你選帳號
  const user = auth.currentUser;
  try {
    // 情況 A：訪客升級成 Google 帳號（uid 不變）
    await user.linkWithPopup(provider);
    await auth.currentUser.reload();
    renderAccount();
    alert('登入成功！之後在其他裝置用同一個 Google 帳號登入，就能看到這些旅程。' +
      (currentPage() === 'page-join' ? '\n\n接著請點選你的名字，加入旅程。' : ''));
  } catch (e) {
    if (e.code === 'auth/credential-already-in-use' || e.code === 'auth/email-already-in-use') {
      // 情況 B：這個 Google 帳號之前用過
      const cred = e.credential || firebase.auth.GoogleAuthProvider.credentialFromError(e);
      if (cred) await switchToExistingAccount(cred);
      else alert('登入失敗，請再試一次');
    } else if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
      // 使用者自己關掉視窗，不用提示
    } else if (e.code === 'auth/popup-blocked') {
      alert('登入視窗被瀏覽器擋住了，請允許彈出式視窗後再試一次');
    } else if (e.code === 'auth/unauthorized-domain') {
      alert('這個網址還沒加入 Firebase 的「授權網域」，請先到 Firebase 設定');
    } else if (e.code === 'auth/operation-not-allowed') {
      alert('Firebase 還沒開啟 Google 登入，請先到 Firebase 設定');
    } else {
      console.error(e);
      alert('登入失敗：' + (e.code || e.message));
    }
  }
}

async function switchToExistingAccount(cred) {
  const oldUid = myUid;
  switchingAccount = true;
  setHeader('旅途分帳', '切換帳號中…');
  try {
    // 1. 先記下訪客身分參加的旅程（切換之後就查不到了）
    const snap = await db.collection('trips').where('memberUids', 'array-contains', oldUid).get();
    const tripIds = snap.docs.map(d => d.id);

    // 2. 切換到 Google 帳號
    stopListening();
    const result = await auth.signInWithCredential(cred);
    const newUid = result.user.uid;
    myUid = newUid;

    // 3. 把這些旅程裡「我」的身分換成 Google 帳號
    for (const id of tripIds) {
      const doc = await tripRef(id).get();
      if (!doc.exists) continue;
      const d = doc.data();
      if (!d.memberUids.includes(newUid)) {
        const members = d.members.map(m => m.uid === oldUid ? { ...m, uid: newUid } : m);
        await tripRef(id).update({ members, memberUids: firebase.firestore.FieldValue.arrayUnion(newUid) });
      }
      // 訪客建立的旅程，建立者也換成 Google 帳號（才能刪除旅程）
      if (d.createdBy === oldUid) await tripRef(id).update({ createdBy: newUid });
    }
    renderAccount();
    alert('已切換到你的 Google 帳號' + (tripIds.length ? `，並把這台裝置上的 ${tripIds.length} 趟旅程一起帶過去。` : '。'));
  } catch (e) {
    console.error(e);
    alert('切換帳號時發生問題：' + (e.code || e.message));
  } finally {
    switchingAccount = false;
    routeAfterLogin();
  }
}

async function logout() {
  if (!confirm('確定登出？登出後這台裝置會變回訪客，要再用 Google 登入才看得到你的旅程。')) return;
  stopListening();
  prevTripId = null;
  localStorage.removeItem(CURRENT_TRIP_KEY);
  await auth.signOut();   // onAuthStateChanged 會自動再以訪客身分登入，並回到旅程列表
}
