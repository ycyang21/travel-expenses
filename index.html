}

/* ---------- 即時更新：匯率預覽、分攤明細 ---------- */
function updateForm() {
  const cur = draft.currency;
  const base = trip.baseCurrency;
  const amount = parseAmount(document.getElementById('f-amount').value || '0', cur);

  // 匯率區塊
  const rateBox = document.getElementById('rate-box');
  if (cur === base) {
    rateBox.style.display = 'none';
  } else {
    rateBox.style.display = 'block';
    const later = draft.rateMode === 'later';
    document.getElementById('rm-now').classList.toggle('on', !later);
    document.getElementById('rm-later').classList.toggle('on', later);
    document.getElementById('rate-later-hint').style.display = later ? 'block' : 'none';
    document.getElementById('rate-now-box').style.display = later ? 'none' : 'block';
    document.getElementById('rate-label').textContent = `匯率（1 ${cur} ＝ 幾 ${base}）`;
    const rate = parseFloat(document.getElementById('f-rate').value);
    document.getElementById('rate-preview').textContent =
      amount && rate > 0 ? `約 ${formatAmount(convertToBase(amount, cur, rate), base)}` : '';
  }

  // 分攤明細
  const box = document.getElementById('split-detail');
  const ids = draft.participants;
  if (ids.length === 0) {
    box.innerHTML = '<div class="hint">請至少選一個分攤的人</div>';
    return;
  }
  if (draft.splitType === 'equal') {
    if (!amount) { box.innerHTML = ''; return; }
    const parts = allocate(amount, ids.map(() => 1));
    box.innerHTML = '<div class="hint">' + ids.map((id, i) =>
      `${escapeHTML(memberName(id))} ${formatAmount(parts[i], cur)}`).join('、') + '</div>';
  } else {
    // 各付各的：每人一個輸入框。只重建一次，避免打字時輸入框跳掉
    const existing = [...box.querySelectorAll('input[data-mid]')].map(i => i.dataset.mid).join();
    if (existing !== ids.join()) {
      box.innerHTML = ids.map(id =>
        `<div class="custom-row"><span>${escapeHTML(memberName(id))}</span>` +
        `<div class="calc-wrap"><input inputmode="decimal" data-mid="${id}" value="${draft.customText[id] || ''}" placeholder="0" ` +
        `oninput="draft.customText['${id}']=this.value;updateRemain()">` +
        `<button class="calc-btn" onclick="openCalc(this.previousElementSibling, 'custom', '${id}')" aria-label="開啟計算機">${CALC_ICON}</button></div></div>`).join('') +
        '<div class="remain" id="remain"></div>';
    }
    updateRemain();
  }
}

// 各付各的模式：顯示還差多少才等於總額
function updateRemain() {
  const el = document.getElementById('remain');
  if (!el) return;
  const cur = draft.currency;
  const amount = parseAmount(document.getElementById('f-amount').value || '0', cur) || 0;
  let sum = 0;
  for (const id of draft.participants) {
    const v = parseAmount(draft.customText[id] || '0', cur);
    if (v === null) { el.textContent = `${memberName(id)} 的金額格式不對`; el.className = 'remain bad'; return; }
    sum += v;
  }
  const diff = amount - sum;
  if (diff === 0) { el.textContent = '✓ 金額剛好'; el.className = 'remain ok'; }
  else if (diff > 0) { el.textContent = `還有 ${formatAmount(diff, cur)} 沒分配`; el.className = 'remain bad'; }
  else { el.textContent = `超過總額 ${formatAmount(-diff, cur)}`; el.className = 'remain bad'; }
}

/* ---------- 儲存 ---------- */
function saveExpense() {
  const cur = draft.currency;
  const base = trip.baseCurrency;
  const amount = parseAmount(document.getElementById('f-amount').value, cur);
  if (!amount) {
    alert('請輸入金額（最多到小數點後兩位）');
    return;
  }
  const title = document.getElementById('f-title').value.trim() ||
    CATEGORIES.find(c => c.id === draft.category).name;
  const date = document.getElementById('f-date').value || todayStr();

  let rate = 1;
  if (cur !== base) {
    if (draft.rateMode === 'later') {
      rate = null;
    } else {
      rate = parseFloat(document.getElementById('f-rate').value);
      if (!(rate > 0)) { alert('請輸入匯率，或改選「之後再算」'); return; }
    }
  }

  const ids = draft.participants;
  if (ids.length === 0) { alert('請至少選一個分攤的人'); return; }

  // 算出每人分攤的原幣金額
  let parts;
  if (draft.splitType === 'equal') {
    parts = allocate(amount, ids.map(() => 1));
  } else {
    parts = ids.map(id => parseAmount(draft.customText[id] || '0', cur));
    if (parts.some(p => p === null)) { alert('有人的金額格式不對'); return; }
    const sum = parts.reduce((a, b) => a + b, 0);
    if (sum !== amount) { alert('每個人的金額加起來要等於總額'); return; }
  }
  const shares = {};
  ids.forEach((id, i) => { shares[id] = parts[i]; });

  // 換算成結算幣：先換總額，再依比例分配，保證加總一致
  // 之後再算：先不換算，baseAmount 和 baseShares 留空（null）
  let baseAmount = null, baseShares = null;
  if (rate !== null) {
    baseAmount = convertToBase(amount, cur, rate);
    const baseParts = allocate(baseAmount, parts);
    baseShares = {};
    ids.forEach((id, i) => { baseShares[id] = baseParts[i]; });
  }

  if (draft.photosLoading || draft.photosBusy) { alert('照片還在處理，請稍等一下再儲存'); return; }

  const now = Date.now();
  const expId = draft.editingId || newId();

  // 照片存在另一個 collection（photos），支出只記照片的 id。
  // 這樣打開支出列表時不會連同照片一起下載，速度才會快。
  const photoCol = tripRef().collection('photos');
  draft.photos.filter(p => p.isNew).forEach(p =>
    photoCol.doc(p.id).set({ id: p.id, expenseId: expId, data: p.data, createdAt: now, createdBy: myUid }).catch(onWriteError));
  draft.removedPhotoIds.forEach(id => photoCol.doc(id).delete().catch(onWriteError));

  const data = {
    title, category: draft.category, date,
    note: document.getElementById('f-note').value.trim(),
    photoIds: draft.photos.map(p => p.id),
    currency: cur, amount, rate,
    payerId: draft.splitType === 'self' ? null : draft.payerId,
    paymentMethod: draft.method,
    paymentMethodOther: draft.method === 'other' ? document.getElementById('f-method-other').value.trim() : '',
    splitType: draft.splitType,
    shares, baseAmount, baseShares,
    v: 2,   // 資料格式版本：金額統一存到小數點後兩位
    updatedAt: now
  };

  const col = tripRef().collection('expenses');
  if (draft.editingId) {
    // update 只改這些欄位，保留 createdAt、createdBy
    col.doc(draft.editingId).update(data).catch(onWriteError);
  } else {
    col.doc(expId).set({ id: expId, createdAt: now, createdBy: myUid, ...data }).catch(onWriteError);
  }

  // 同步這筆支出的逐筆還款紀錄
  syncExpenseRepayments({ id: expId, ...data }, document.getElementById('f-settled').checked, draft.settledBefore);

  // 記住這次的幣別（只存在這支手機）和匯率（旅伴共用）
  localStorage.setItem(LAST_CURRENCY_KEY, cur);
  if (cur !== base) localStorage.setItem(RATE_MODE_KEY, draft.rateMode);
  if (draft.method) localStorage.setItem(METHOD_KEY, draft.method); else localStorage.removeItem(METHOD_KEY);
  if (draft.method === 'other') localStorage.setItem(METHOD_OTHER_KEY, data.paymentMethodOther);
  if (cur !== base && rate !== null && (trip.rates || {})[cur] !== rate) {
    tripRef().update({ ['rates.' + cur]: rate }).catch(onWriteError);
  }
  // 不用等雲端回應：有離線快取，畫面會立刻更新；沒網路時也不會卡住
  showPage('page-list');
}

function deleteExpense() {
  if (!draft.editingId) return;
  if (!confirm('確定刪除這筆支出？')) return;
  const e = expenses.find(x => x.id === draft.editingId);
  (e && e.photoIds || []).forEach(id => tripRef().collection('photos').doc(id).delete().catch(onWriteError));
  transfers.filter(t => t.expenseId === draft.editingId)
    .forEach(t => tripRef().collection('transfers').doc(t.id).delete().catch(onWriteError));
  tripRef().collection('expenses').doc(draft.editingId).delete().catch(onWriteError);
  showPage('page-list');
}

/* ---------- 支出列表 ---------- */
function isConverted(e) { return e.baseAmount != null; }

// 加總：已換算的算結算幣；還沒換算的外幣，各幣別分開加
function sumExpenses(list) {
  const base = trip.baseCurrency;
  let total = 0;
  const foreign = {};
  for (const e of list) {
    if (isConverted(e)) total += e.baseAmount;
    else foreign[e.currency] = (foreign[e.currency] || 0) + e.amount;
  }
  const parts = [formatAmount(total, base)];
  for (const [c, v] of Object.entries(foreign)) parts.push(formatAmount(v, c));
  return { total, foreign, text: parts.join(' ＋ ') };
}

function renderList() {
  const box = document.getElementById('expense-list');
  if (!trip) return;
  if (expenses.length === 0) {
    box.innerHTML = '<div class="empty"><strong>還沒有任何支出</strong>點下方的 ＋ 記下第一筆</div>';
    return;
  }
  const base = trip.baseCurrency;
  const sum = sumExpenses(expenses);

  // 新的日期在上面；同一天內新的在上面
  const sorted = [...expenses].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  const groups = {};
  sorted.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });

  let html = `<div class="total-bar"><span>旅程總花費</span><strong>${formatAmount(sum.total, base)}</strong></div>`;
  const foreignList = Object.entries(sum.foreign);
  if (foreignList.length) {
    html += `<div class="hint" style="text-align:right;margin:6px 4px 0">另有尚未換算：${foreignList.map(([c, v]) => formatAmount(v, c)).join('、')}</div>`;
  }
  for (const [date, list] of Object.entries(groups)) {
    const [y, m, d] = date.split('-');
    html += `<div class="day-head"><span>${Number(m)}/${Number(d)}</span><span>${sumExpenses(list).text}</span></div>`;
    html += list.map(e => {
      const cat = CATEGORIES.find(c => c.id === e.category) || CATEGORIES[5];
      const n = Object.keys(e.shares).length;
      let converted = '';
      if (e.currency !== base) converted = isConverted(e) ? `<small>≈ ${formatAmount(e.baseAmount, base)}</small>` : '<small>尚未換算</small>';
      return `<button class="exp" onclick="openEditForm('${e.id}')">
        <span class="icon">${cat.icon}</span>
        <span class="mid"><div class="title">${escapeHTML(e.title)}</div>
          <div class="who">${e.splitType === 'self' ? `各付各的${methodLabel(e) ? `（${escapeHTML(methodLabel(e))}）` : ''}・${n} 人` : `${escapeHTML(memberName(e.payerId))} 付款${methodLabel(e) ? `（${escapeHTML(methodLabel(e))}）` : ''}・${n} 人分攤`}${isFullySettled(e) ? '・<span class="settled-tag">✓已結清</span>' : ''}${e.note ? '・📝' : ''}${(e.photoIds || []).length ? `・📷${e.photoIds.length}` : ''}</div></span>
        <span class="money">${formatAmount(e.amount, e.currency)}${converted}</span>
      </button>`;
    }).join('');
  }
  box.innerHTML = html;
}

/* =========================================================
   第三步：結算
   ---------------------------------------------------------
   1. 每個人的淨額 = 他付出去的錢 − 他應該分攤的錢 ± 已經還的錢
        正數：別人欠他　　負數：他欠別人
      因為每筆支出的 baseShares 加總剛好等於 baseAmount，
      所有人的淨額加起來一定是 0。
   2. 最少轉帳：每次讓「欠最多的人」還給「被欠最多的人」，
      能還多少就還多少，其中一方歸零後換下一個。
      n 個人最多只需要 n−1 筆轉帳。
   ========================================================= */

// 把支出分組：已換算的一組（結算幣），每個還沒換算的外幣各一組
function settleGroups() {
  const base = trip.baseCurrency;
  const groups = [{ currency: base, converted: true, list: expenses.filter(isConverted) }];
  const foreign = {};
  expenses.filter(e => !isConverted(e)).forEach(e => { (foreign[e.currency] = foreign[e.currency] || []).push(e); });
  for (const [c, list] of Object.entries(foreign)) groups.push({ currency: c, converted: false, list });
  return groups;
}

// 算一組的每人淨額
function computeBalances(group) {
  const bal = {};
  trip.members.forEach(m => { bal[m.id] = { paid: 0, owed: 0, net: 0 }; });
  const ensure = id => (bal[id] = bal[id] || { paid: 0, owed: 0, net: 0 });
  const amt = e => group.converted ? e.baseAmount : e.amount;
  const shares = e => group.converted ? e.baseShares : e.shares;

  for (const e of group.list) {
    if (e.splitType === 'self') {
      // 各付各的：每個人付了自己那份，也花了自己那份 → 不會產生欠款
      for (const [id, v] of Object.entries(shares(e))) { ensure(id).paid += v; ensure(id).owed += v; }
      continue;
    }
    ensure(e.payerId).paid += amt(e);
    for (const [id, v] of Object.entries(shares(e))) ensure(id).owed += v;
  }
  for (const id in bal) bal[id].net = bal[id].paid - bal[id].owed;

  // 這個幣別已經還的錢：付錢的人淨額增加，收錢的人淨額減少
  for (const t of transfers.filter(t => t.currency === group.currency)) {
    ensure(t.fromId).net += t.amount;
    ensure(t.toId).net -= t.amount;
  }
  return bal;
}

function computeTransfers(bal) {
  const creditors = [];  // 別人欠他
  const debtors = [];    // 他欠別人
  for (const [id, b] of Object.entries(bal)) {
    if (b.net > 0) creditors.push({ id, amt: b.net });
    if (b.net < 0) debtors.push({ id, amt: -b.net });
  }
  creditors.sort((a, b) => b.amt - a.amt);
  debtors.sort((a, b) => b.amt - a.amt);

  const result = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    result.push({ fromId: debtors[i].id, toId: creditors[j].id, amount: pay });
    debtors[i].amt -= pay;
    creditors[j].amt -= pay;
    if (debtors[i].amt === 0) i++;
    if (creditors[j].amt === 0) j++;
  }
  return result;
}

function transferRows(todo, currency) {
  if (todo.length === 0) return '<div class="all-clear">✓ 大家都兩清了</div>';
  return todo.map((t, i) => `<div class="transfer">
    <div class="flow"><b>${escapeHTML(memberName(t.fromId))}</b> 給 <b>${escapeHTML(memberName(t.toId))}</b>
      <span class="amt">${formatAmount(t.amount, currency)}</span></div>
    <button class="done-btn" onclick="markPaid('${currency}', ${i})">已還</button>
  </div>`).join('');
}

function renderSettle() {
  const box = document.getElementById('settle-box');
  if (!trip) return;
  if (expenses.length === 0) {
    box.innerHTML = '<div class="empty"><strong>還沒有支出可以結算</strong>先記幾筆帳再回來看</div>';
    return;
  }
  const base = trip.baseCurrency;
  const groups = settleGroups();
  const main = groups[0];
  const foreignGroups = groups.slice(1);
  const mainBal = computeBalances(main);
  let html = '';

  // 1. 還沒換算的外幣：一次換算
  if (foreignGroups.length) {
    html += '<div class="card"><h2>尚未換算的外幣</h2>' +
      '<p class="hint" style="margin-top:0">設定匯率後按「換算」，這些支出會一起換成 ' + base + '，併入下方的結算。</p>';
    html += foreignGroups.map(g => {
      const total = g.list.reduce((a, e) => a + e.amount, 0);
      const c = g.currency;
      return `<div style="margin-top:14px">
        <div><b>${c}</b>：${g.list.length} 筆，共 ${formatAmount(total, c)}</div>
        <label for="conv-${c}">匯率（1 ${c} ＝ 幾 ${base}）</label>
        <div class="rate-row">
          <input id="conv-${c}" inputmode="decimal" value="${(trip.rates || {})[c] || ''}" placeholder="例如 32.5" oninput="previewConvert('${c}')">
          <button class="rate-fetch" onclick="fetchConvertRate('${c}')">🔄 最新匯率</button>
        </div>
        <div class="hint" id="conv-hint-${c}"></div>
        <button class="btn" style="margin-top:10px" onclick="convertCurrency('${c}')">換算 ${c}</button>
      </div>`;
    }).join('');
    html += '</div>';
  }

  // 2. 還需要的轉帳（結算幣）
  if (main.list.length || transfers.some(t => t.currency === base)) {
    html += `<div class="card"><h2>要怎麼還</h2>${transferRows(computeTransfers(mainBal), base)}</div>`;
  }

  // 2.5 逐筆明細（收合）
  html += renderItemDebts();

  // 3. 還沒換算的外幣，也可以直接用外幣互相還
  for (const g of foreignGroups) {
    html += `<div class="card"><h2>要怎麼還（${g.currency}，尚未換算）</h2>` +
      '<p class="hint" style="margin-top:0">如果大家直接用外幣現金還，照這裡還就好，不必換算。</p>' +
      transferRows(computeTransfers(computeBalances(g)), g.currency) + '</div>';
  }

  // 4. 每個人的收支
  html += `<div class="card"><h2>每人明細（${base}）</h2>`;
  html += trip.members.map(m => {
    const b = mainBal[m.id];
    const cls = b.net > 0 ? 'plus' : b.net < 0 ? 'minus' : 'zero';
    const label = b.net > 0 ? '可收回' : b.net < 0 ? '還要付' : '已兩清';
    const extra = foreignGroups.map(g => {
      const owed = g.list.reduce((a, e) => a + (e.shares[m.id] || 0), 0);
      return owed ? formatAmount(owed, g.currency) : '';
    }).filter(Boolean);
    return `<div class="bal">
      <div><div class="name">${escapeHTML(m.name)}</div>
        <div class="detail">付了 ${formatAmount(b.paid, base)}・實際花費 ${formatAmount(b.owed, base)}</div>
        ${extra.length ? `<div class="detail">另有未換算花費 ${extra.join('、')}</div>` : ''}</div>
      <div class="net ${cls}"><div class="detail">${label}</div>${formatAmount(Math.abs(b.net), base)}</div>
    </div>`;
  }).join('');
  html += '</div>';

  // 5. 已經還的紀錄
  if (transfers.length) {
    html += '<div class="card"><h2>已還款紀錄</h2>';
    html += [...transfers].sort((a, b) => b.createdAt - a.createdAt).map(t => `<div class="transfer paid">
      <div class="flow">${escapeHTML(memberName(t.fromId))} 給 ${escapeHTML(memberName(t.toId))}
        <span class="amt">${formatAmount(t.amount, t.currency)}</span>
        <span class="detail">${t.date}${t.expenseId ? `・${escapeHTML((expenses.find(e => e.id === t.expenseId) || {}).title || '')}` : ''}</span></div>
      <button class="undo-btn" onclick="undoPaid('${t.id}')">取消</button>
    </div>`).join('');
    html += '</div>';
  }

  html += '<button class="btn ghost" onclick="shareSettle()">分享結算結果</button>';
  box.innerHTML = html;
  foreignGroups.forEach(g => previewConvert(g.currency));
}

// 按「已還」：記一筆還款，結算會自動重算
function markPaid(currency, i) {
  const group = settleGroups().find(g => g.currency === currency && (g.converted === (currency === trip.baseCurrency)));
  if (!group) return;
  const t = computeTransfers(computeBalances(group))[i];
  if (!t) return;
  const msg = `確認 ${memberName(t.fromId)} 已經給 ${memberName(t.toId)} ${formatAmount(t.amount, currency)}？`;
  if (!confirm(msg)) return;
  const id = newId();
  tripRef().collection('transfers').doc(id)
    .set({ id, fromId: t.fromId, toId: t.toId, amount: t.amount, currency, date: todayStr(), createdAt: Date.now(), createdBy: myUid, v: 2 })
    .catch(onWriteError);
}

function undoPaid(id) {
  if (!confirm('取消這筆還款紀錄？')) return;
  tripRef().collection('transfers').doc(id).delete().catch(onWriteError);
}

/* ---------- 一次換算某個外幣 ---------- */
function previewConvert(c) {
  const el = document.getElementById('conv-hint-' + c);
  if (!el) return;
  const rate = parseFloat(document.getElementById('conv-' + c).value);
  const total = expenses.filter(e => !isConverted(e) && e.currency === c).reduce((a, e) => a + e.amount, 0);
  el.textContent = rate > 0 ? `換算後約 ${formatAmount(convertToBase(total, c, rate), trip.baseCurrency)}` : '';
}

async function fetchConvertRate(c) {
  const el = document.getElementById('conv-hint-' + c);
  el.textContent = '正在抓匯率…';
  try {
    const { rate, date } = await getRate(c, trip.baseCurrency, todayStr());
    document.getElementById('conv-' + c).value = rate;
    previewConvert(c);
    const [, m, d] = date.split('-');
    el.textContent += `（${Number(m)}/${Number(d)} 國際市場匯率）`;
  } catch (e) {
    el.textContent = '抓不到匯率，請手動輸入';
  }
}

function convertCurrency(c) {
  const base = trip.baseCurrency;
  const rate = parseFloat(document.getElementById('conv-' + c).value);
  if (!(rate > 0)) { alert('請輸入匯率'); return; }
  const list = expenses.filter(e => !isConverted(e) && e.currency === c);
  const paidList = transfers.filter(t => t.currency === c);
  if (!confirm(`把 ${list.length} 筆 ${c} 支出，用 1 ${c} = ${rate} ${base} 換算？\n換算後可以到各筆支出個別修改。`)) return;

  // 一次寫入（batch）：全部成功或全部失敗，不會只換一半
  const batch = db.batch();
  const newBaseShares = {};   // 支出 id → 換算後每人金額
  for (const e of list) {
    const baseAmount = convertToBase(e.amount, c, rate);
    const ids = Object.keys(e.shares);
    const parts = allocate(baseAmount, ids.map(id => e.shares[id]));
    const baseShares = {};
    ids.forEach((id, i) => { baseShares[id] = parts[i]; });
    newBaseShares[e.id] = baseShares;
    // 舊格式的支出順便存成新格式（amount、shares 用換算過的新值）
    batch.update(tripRef().collection('expenses').doc(e.id),
      { rate, baseAmount, baseShares, amount: e.amount, shares: e.shares, v: 2, updatedAt: Date.now() });
  }
  // 已經用外幣還過的錢，也一起換成結算幣
  for (const t of paidList) {
    const linked = t.expenseId && newBaseShares[t.expenseId];
    const amount = linked ? (linked[t.fromId] || 0) : convertToBase(t.amount, c, rate);
    batch.update(tripRef().collection('transfers').doc(t.id), { amount, currency: base, v: 2 });
  }
  batch.update(tripRef(), { ['rates.' + c]: rate });
  batch.commit().catch(onWriteError);
}

// 產生一段文字，可以直接貼到 LINE 群組
async function shareSettle() {
  const base = trip.baseCurrency;
  const groups = settleGroups();
  const mainBal = computeBalances(groups[0]);
  let text = `【${trip.name}】結算\n總花費 ${sumExpenses(expenses).text}\n`;
  for (const g of groups) {
    if (!g.converted) text += `\n${g.currency}（尚未換算）：\n`;
    else if (!g.list.length) continue;
    else text += '\n';
    const todo = computeTransfers(computeBalances(g));
    text += todo.length
      ? todo.map(t => `${memberName(t.fromId)} → ${memberName(t.toId)}：${formatAmount(t.amount, g.currency)}`).join('\n')
      : '大家都兩清了！';
    text += '\n';
  }
  text += `\n每人實際花費（${base}）：\n` + trip.members.map(m => `${m.name} ${formatAmount(mainBal[m.id].owed, base)}`).join('\n');

  try {
    if (navigator.share) {           // 手機：跳出分享選單（可選 LINE）
      await navigator.share({ text });
    } else {                         // 電腦：複製到剪貼簿
      await navigator.clipboard.writeText(text);
      alert('已複製，可以貼到聊天室');
    }
  } catch (e) {
    if (e.name !== 'AbortError') prompt('請手動複製：', text);   // 使用者按取消不算錯誤
  }
}


/* =========================================================
   內建計算機
   ---------------------------------------------------------
   點金額欄位 → 下方跳出計算機 → 按「確定」把結果填回欄位。
   不用 eval()（有安全疑慮），自己寫一個簡單的四則運算：
   先算 × ÷，再算 + −。
   ========================================================= */
let calc = null;   // { input, kind: 'amount'|'custom', memberId, expr }
const CALC_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="3" rx=".5"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>`;

function openCalc(input, kind, memberId) {
  if (!draft) return;
  input.blur();   // 避免手機跳出系統鍵盤
  calc = { input, kind, memberId, expr: input.value.replace(/[^\d.]/g, '').replace(/\.$/, '') };
  document.getElementById('calc-label').textContent =
    kind === 'amount' ? `總金額（${draft.currency}）` : `${memberName(memberId)} 要付（${draft.currency}）`;
  renderCalcQuick();
  renderCalc();
  document.getElementById('calc').classList.add('show');
}

function closeCalc() {
  document.getElementById('calc').classList.remove('show');
  calc = null;
}

// 按鍵輸入
function calcKey(k) {
  if (!calc) return;
  let e = calc.expr;
  const last = e.slice(-1);
  const isOp = c => '+−×÷'.includes(c);
  if (k === 'C') e = '';
  else if (k === 'back') e = e.slice(0, -1);
  else if (isOp(k)) {
    if (e === '') return;                 // 開頭不能是運算符號
    e = isOp(last) ? e.slice(0, -1) + k : e + k;   // 連按兩個符號：換成新的
  } else if (k === '.') {
    const curNum = e.split(/[+−×÷]/).pop();
    if (curNum.includes('.')) return;     // 同一個數字只能有一個小數點
    e += curNum === '' ? '0.' : '.';
  } else {
    const curNum = e.split(/[+−×÷]/).pop();
    if (curNum === '0') e = e.slice(0, -1);   // 避免 007
    e += k;
  }
  calc.expr = e;
  renderCalc();
}

// 把算式算出答案；算式不完整或除以 0 時回傳 null
function evalExpr(expr) {
  const tokens = expr.match(/\d+\.?\d*|\.\d+|[+−×÷]/g);
  if (!tokens) return null;
  if ('+−×÷'.includes(tokens[tokens.length - 1])) tokens.pop();   // 結尾的符號先忽略
  if (!tokens.length) return null;
  // 第一輪：處理 × ÷
  const stack = [parseFloat(tokens[0])];
  for (let i = 1; i < tokens.length; i += 2) {
    const op = tokens[i], n = parseFloat(tokens[i + 1]);
    if (op === '×') stack[stack.length - 1] *= n;
    else if (op === '÷') {
      if (n === 0) return null;
      stack[stack.length - 1] /= n;
    } else stack.push(op, n);
  }
  // 第二輪：處理 + −
  let result = stack[0];
  for (let i = 1; i < stack.length; i += 2) {
    result = stack[i] === '+' ? result + stack[i + 1] : result - stack[i + 1];
  }
  return result;
}

// 四捨五入到這個幣別的小數位數，回傳文字（例如 "1262" 或 "12.35"）
function roundForCurrency(value, currency) {
  const d = CURRENCIES[currency].decimals;
  return (Math.round(value * 10 ** d) / 10 ** d).toFixed(d);
}

function renderCalc() {
  const cur = draft.currency;
  document.getElementById('calc-expr').textContent = calc.expr;
  const v = evalExpr(calc.expr);
  const note = document.getElementById('calc-note');
  const res = document.getElementById('calc-result');
  if (calc.expr === '') { res.textContent = '0'; note.textContent = ''; return; }
  if (v === null) { res.textContent = '—'; note.textContent = /÷0(?![.\d])/.test(calc.expr) ? '不能除以 0' : ''; return; }
  const text = roundForCurrency(v, cur);
  res.textContent = formatAmount(parseAmount(text.replace('-', ''), cur) * (v < 0 ? -1 : 1), cur);
  note.textContent = Math.abs(parseFloat(text) - v) > 1e-9 ? '已四捨五入' : '';
}

// 快速按鈕：只在「各付各的」出現
function renderCalcQuick() {
  const box = document.getElementById('calc-quick');
  box.innerHTML = '';
  if (calc.kind !== 'custom') return;
  const cur = draft.currency;
  const toText = v => minorToText(v, cur);
  const total = parseAmount(document.getElementById('f-amount').value || '0', cur) || 0;
  if (!total) return;
  const n = draft.participants.length;
  // 其他人已經填的金額（不含這個人）
  let others = 0;
  for (const id of draft.participants) {
    if (id === calc.memberId) continue;
    others += parseAmount(draft.customText[id] || '0', cur) || 0;
  }
  const remain = total - others;
  const chips = [];
  chips.push(`<button onclick="calcInsert('${toText(total)}÷${n}')">平分 ${formatAmount(Math.round(total / n), cur)}</button>`);
  if (remain > 0 && others > 0) chips.push(`<button onclick="calcInsert('${toText(remain)}')">剩下的 ${formatAmount(remain, cur)}</button>`);
  chips.push(`<button onclick="calcInsert('${toText(total)}')">總額 ${formatAmount(total, cur)}</button>`);
  box.innerHTML = chips.join('');
}

// 快速按鈕：算式最後是符號就接在後面（例如 500+ 再按平分），否則直接取代
function calcInsert(text) {
  const plain = text.replace(/\.0+(?=$|÷)/g, '');   // 3786.00 → 3786，比較好讀
  calc.expr = /[+−×÷]$/.test(calc.expr) ? calc.expr + plain : plain;
  renderCalc();
}

function calcConfirm() {
  if (!calc) return;
  const cur = draft.currency;
  let text = '';
  if (calc.expr !== '') {
    const v = evalExpr(calc.expr);
    if (v === null) { alert('算式不完整'); return; }
    if (v < 0) { alert('金額不能是負數'); return; }
    text = roundForCurrency(v, cur);
    text = text.replace(/\.0+$/, '');   // 12.00 顯示成 12
  }
  const { input, kind, memberId } = calc;
  input.value = text;
  closeCalc();
  if (kind === 'amount') updateForm();
  else { draft.customText[memberId] = text; updateRemain(); }
}

// 電腦上也能用鍵盤操作計算機
document.addEventListener('keydown', e => {
  if (!calc) return;
  const map = { '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', '.': '.', 'Backspace': 'back', 'Delete': 'C' };
  if (/^[0-9]$/.test(e.key)) calcKey(e.key);
  else if (map[e.key]) calcKey(map[e.key]);
  else if (e.key === 'Enter' || e.key === '=') calcConfirm();
  else if (e.key === 'Escape') closeCalc();
  else return;
  e.preventDefault();
});


/* =========================================================
   照片
   ---------------------------------------------------------
   手機照片動輒 3–5 MB，Firestore 一筆資料最多 1 MB，
   所以上傳前先在手機上縮小（最長邊 1280 像素）、壓成 JPEG，
   通常只剩 150–300 KB，收據上的字還是看得清楚。
   ========================================================= */
const MAX_PHOTOS = 4;
const MAX_PHOTO_CHARS = 700000;   // 壓縮後的文字長度上限（約 500 KB），留空間給 1 MB 限制

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let maxSide = 1280, quality = 0.7;
      for (let attempt = 0; attempt < 8; attempt++) {
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * scale);
        const h = Math.round(img.naturalHeight * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';            // 透明背景的圖片（PNG 截圖）改成白底
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const data = canvas.toDataURL('image/jpeg', quality);
        if (data.length <= MAX_PHOTO_CHARS) { resolve(data); return; }
        // 還是太大：先降畫質，再縮尺寸
        if (quality > 0.5) quality -= 0.1;
        else maxSide = Math.round(maxSide * 0.8);
      }
      reject(new Error('圖片太大，壓縮不下來'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這個檔案，請換一張圖片')); };
    img.src = url;
  });
}

async function addPhotos(fileList) {
  const files = [...fileList];
  const room = MAX_PHOTOS - draft.photos.length;
  if (files.length > room) alert(`最多 ${MAX_PHOTOS} 張，只會加入前 ${room} 張`);
  draft.photosBusy = true;
  renderPhotos();
  for (const f of files.slice(0, room)) {
    try {
      draft.photos.push({ id: newId(), data: await compressImage(f), isNew: true });
    } catch (e) {
      alert(e.message);
    }
    renderPhotos();
  }
  draft.photosBusy = false;
  renderPhotos();
}

function removePhoto(i) {
  if (!confirm('刪除這張照片？（按儲存後才會真的刪除）')) return;
  const [p] = draft.photos.splice(i, 1);
  if (!p.isNew) draft.removedPhotoIds.push(p.id);
  renderPhotos();
}

// 編輯支出時，從雲端讀回照片
function loadPhotos(e) {
  const ids = e.photoIds || [];
  if (!ids.length) { renderPhotos(); return; }
  const editingId = e.id;
  draft.photosLoading = true;
  renderPhotos();
  Promise.all(ids.map(id => tripRef().collection('photos').doc(id).get()))
    .then(docs => {
      if (!draft || draft.editingId !== editingId) return;   // 已經離開這筆了
      draft.photos = docs.filter(d => d.exists).map(d => ({ id: d.id, data: d.data().data, isNew: false }));
    })
    .catch(err => { console.error(err); alert('照片讀取失敗：' + (err.code || err.message)); })
    .finally(() => {
      if (!draft || draft.editingId !== editingId) return;
      draft.photosLoading = false;
      renderPhotos();
    });
}

function renderPhotos() {
  const box = document.getElementById('f-photos');
  if (draft.photosLoading) { box.innerHTML = '<div class="hint" style="grid-column:1/-1">照片載入中…</div>'; return; }
  let html = draft.photos.map((p, i) =>
    `<div class="thumb"><img src="${p.data}" alt="照片 ${i + 1}" onclick="viewPhoto(${i})">` +
    `<button class="rm" onclick="removePhoto(${i})" aria-label="刪除照片">✕</button></div>`).join('');
  if (draft.photosBusy) html += '<div class="add-photo">處理中…</div>';
  else if (draft.photos.length < MAX_PHOTOS)
    html += `<button class="add-photo" onclick="document.getElementById('f-photo-input').click()"><span>📷</span>加照片</button>`;
  box.innerHTML = html;
}

function viewPhoto(i) {
  document.getElementById('viewer-img').src = draft.photos[i].data;
  document.getElementById('photo-viewer').classList.add('show');
}
function closeViewer() {
  document.getElementById('photo-viewer').classList.remove('show');
  document.getElementById('viewer-img').src = '';
}


/* =========================================================
   自動抓匯率
   ---------------------------------------------------------
   資料來源：fawazahmed0 Exchange API（免費、免註冊、每天更新）
     https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@2027-02-10/v1/currencies/usd.min.json
     → { "date": "2027-02-10", "usd": { "twd": 32.45, "jpy": 150.2, ... } }
   主要網址失敗時改用備援網址（官方建議一定要做）。
   這是國際市場中間價，不是台灣銀行的牌告匯率。
   ========================================================= */
const RATE_EARLIEST = '2024-03-02';   // 這個來源最早的資料日期
const rateCache = {};                 // 同一天同幣別只抓一次
let rateRequestNo = 0;                // 連續切換時，只採用最後一次的結果

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// 取得 1 單位 from 幣別 = 多少 to 幣別；回傳 { rate, date(實際資料日期) }
// 快取存的是「請求本身」，同時重複呼叫也只會真的連線一次
function getRate(from, to, date) {
  const key = `${from}-${to}-${date}`;
  if (!rateCache[key]) {
    rateCache[key] = requestRate(from, to, date).catch(e => { delete rateCache[key]; throw e; });
  }
  return rateCache[key];
}

async function requestRate(from, to, date) {
  const f = from.toLowerCase(), t = to.toLowerCase();
  const urls = d => [
    `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${d}/v1/currencies/${f}.min.json`,
    `https://${d}.currency-api.pages.dev/v1/currencies/${f}.min.json`
  ];
  // 今天或未來的日期可能還沒有資料，就改抓最新的
  const tries = [...urls(date)];
  if (date >= todayStr()) tries.push(...urls('latest'));
  let lastErr;
  for (const url of tries) {
    try {
      const data = await fetchJSON(url);
      const rate = data[f] && data[f][t];
      if (!rate) throw new Error('沒有這個幣別的資料');
      return { rate: parseFloat(rate.toPrecision(6)), date: data.date || date };
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function setRateMode(m) {
  draft.rateMode = m;
  updateForm();
  if (m === 'now' && !document.getElementById('f-rate').value) { draft.rateManual = false; autoFetchRate(); }
}

function setRateSource(text) {
  document.getElementById('rate-source').textContent = text;
}

// 表單上的「抓匯率」按鈕
async function fetchRateForForm() {
  if (!draft) return;
  const cur = draft.currency, base = trip.baseCurrency;
  if (cur === base) return;
  const date = document.getElementById('f-date').value || todayStr();
  if (date < RATE_EARLIEST) { setRateSource('這個日期太早，沒有匯率資料，請手動輸入'); return; }
  if (!navigator.onLine) { setRateSource('目前離線，先用上次的匯率，或手動輸入'); return; }

  const myNo = ++rateRequestNo;
  const btn = document.getElementById('rate-fetch-btn');
  btn.disabled = true;
  setRateSource('正在抓匯率…');
  try {
    const { rate, date: gotDate } = await getRate(cur, base, date);
    if (myNo !== rateRequestNo || !draft || draft.currency !== cur) return;   // 使用者已經換了幣別或日期
    document.getElementById('f-rate').value = rate;
    draft.rateManual = false;
    const [, m, d] = gotDate.split('-');
    setRateSource(`${Number(m)}/${Number(d)} 國際市場匯率` + (gotDate !== date ? '（所選日期還沒有資料，用最新的）' : ''));
    updateForm();
  } catch (e) {
    console.error(e);
    if (myNo === rateRequestNo) setRateSource('抓不到匯率，請手動輸入');
  } finally {
    if (myNo === rateRequestNo) btn.disabled = false;
  }
}

// 換幣別、換日期、開新表單時自動抓；但使用者自己改過的匯率不會被蓋掉
function autoFetchRate() {
  if (!draft || draft.rateManual || draft.rateMode === 'later') return;
  fetchRateForForm();
}


/* =========================================================
   Google 登入（跨裝置同步）
   ---------------------------------------------------------
   沒登入時是「訪客」（匿名登入），身分只綁在這台裝置的瀏覽器。
   用 Google 登入後，身分綁在 Google 帳號上，任何裝置登入同一個帳號，
   都會是同一個 uid，看得到同樣的旅程。

   兩種情況：
   A. 這個 Google 帳號第一次使用：把訪客身分「升級」成 Google 帳號
      （linkWithPopup），uid 不變，原本的旅程直接保留。
   B. 這個 Google 帳號已經在別台裝置用過：切換成那個帳號，
      並把這台裝置上訪客身分參加的旅程，一起搬到 Google 帳號底下。
   ========================================================= */
let switchingAccount = false;

const GOOGLE_ICON = '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';

function renderAccount() {
  const u = auth.currentUser;
  if (!u) return;
  let html;
  if (u.isAnonymous) {
    html = `<h2>帳號</h2>
      <p class="hint" style="margin-top:0">目前是<b>訪客</b>：旅程只存在這台裝置的瀏覽器。用 Google 登入後，手機、平板、電腦都能看到同樣的紀錄。</p>
      <button class="google-btn" onclick="loginWithGoogle()">${GOOGLE_ICON}用 Google 登入</button>`;
  } else {
    const email = u.email || (u.providerData[0] && u.providerData[0].email) || '';
    html = `<h2>帳號</h2>
      <div class="account-row">
        <div class="who-am-i">已用 Google 登入<small>${escapeHTML(email)}</small></div>
        <button class="small-btn" style="background:#fff;color:var(--muted);border:1px solid var(--line)" onclick="logout()">登出</button>
      </div>`;
  }
  document.querySelectorAll('.account-card').forEach(el => { el.innerHTML = html; });
}

async function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });   // 每次都讓你選帳號
  const user = auth.currentUser;
  try {
    // 情況 A：訪客升級成 Google 帳號（uid 不變）
    await user.linkWithPopup(provider);
    await auth.currentUser.reload();
    renderAccount();
    alert('登入成功！之後在其他裝置用同一個 Google 帳號登入，就能看到這些旅程。');
  } catch (e) {
    if (e.code === 'auth/credential-already-in-use' || e.code === 'auth/email-already-in-use') {
      // 情況 B：這個 Google 帳號之前用過
      const cred = e.credential || firebase.auth.GoogleAuthProvider.credentialFromError(e);
      if (cred) await switchToExistingAccount(cred);
      else alert('登入失敗，請再試一次');
    } else if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
      // 使用者自己關掉視窗，不用提示
    } else if (e.code === 'auth/popup-blocked') {
      alert('登入視窗被瀏覽器擋住了，請允許彈出式視窗後再試一次');
    } else if (e.code === 'auth/unauthorized-domain') {
      alert('這個網址還沒加入 Firebase 的「授權網域」，請先到 Firebase 設定');
    } else if (e.code === 'auth/operation-not-allowed') {
      alert('Firebase 還沒開啟 Google 登入，請先到 Firebase 設定');
    } else {
      console.error(e);
      alert('登入失敗：' + (e.code || e.message));
    }
  }
}

async function switchToExistingAccount(cred) {
  const oldUid = myUid;
  switchingAccount = true;
  setHeader('旅途分帳', '切換帳號中…');
  try {
    // 1. 先記下訪客身分參加的旅程（切換之後就查不到了）
    const snap = await db.collection('trips').where('memberUids', 'array-contains', oldUid).get();
    const tripIds = snap.docs.map(d => d.id);

    // 2. 切換到 Google 帳號
    stopListening();
    const result = await auth.signInWithCredential(cred);
    const newUid = result.user.uid;
    myUid = newUid;

    // 3. 把這些旅程裡「我」的身分換成 Google 帳號
    for (const id of tripIds) {
      const doc = await tripRef(id).get();
      if (!doc.exists) continue;
      const d = doc.data();
      if (!d.memberUids.includes(newUid)) {
        const members = d.members.map(m => m.uid === oldUid ? { ...m, uid: newUid } : m);
        await tripRef(id).update({ members, memberUids: firebase.firestore.FieldValue.arrayUnion(newUid) });
      }
      // 訪客建立的旅程，建立者也換成 Google 帳號（才能刪除旅程）
      if (d.createdBy === oldUid) await tripRef(id).update({ createdBy: newUid });
    }
    renderAccount();
    alert('已切換到你的 Google 帳號' + (tripIds.length ? `，並把這台裝置上的 ${tripIds.length} 趟旅程一起帶過去。` : '。'));
  } catch (e) {
    console.error(e);
    alert('切換帳號時發生問題：' + (e.code || e.message));
  } finally {
    switchingAccount = false;
    routeAfterLogin();
  }
}

async function logout() {
  if (!confirm('確定登出？登出後這台裝置會變回訪客，要再用 Google 登入才看得到你的旅程。')) return;
  stopListening();
  localStorage.removeItem(CURRENT_TRIP_KEY);
  await auth.signOut();   // onAuthStateChanged 會自動再以訪客身分登入，並回到旅程列表
}


/* =========================================================
   逐筆還款
   ---------------------------------------------------------
   還款紀錄（transfers）多一個欄位 expenseId，代表「還的是哪一筆支出」。
   結算的算法不用改：它本來就會把所有還款紀錄算進去，
   所以逐筆還的錢，會自動從「要怎麼還」裡扣掉。
   ========================================================= */
let itemsOpen = false;   // 逐筆明細是否展開（重新整理畫面時保持原狀）

// 一筆支出裡，誰欠付款人多少（用結算時的幣別：已換算用結算幣，未換算用外幣）
function expenseDebts(e) {
  if (e.splitType === 'self' || !e.payerId) return [];
  const conv = isConverted(e);
  const shares = conv ? e.baseShares : e.shares;
  const currency = conv ? trip.baseCurrency : e.currency;
  return Object.entries(shares)
    .filter(([id, v]) => id !== e.payerId && v > 0)
    .map(([id, v]) => ({ fromId: id, toId: e.payerId, amount: v, currency }));
}

function isFullySettled(e) {
  const debts = expenseDebts(e);
  if (!debts.length) return false;
  const paid = transfers.filter(t => t.expenseId === e.id).map(t => t.fromId);
  return debts.every(d => paid.includes(d.fromId));
}

function writeRepayment(expenseId, d) {
  const id = newId();
  tripRef().collection('transfers').doc(id).set({
    id, expenseId, fromId: d.fromId, toId: d.toId, amount: d.amount, currency: d.currency,
    date: todayStr(), createdAt: Date.now(), createdBy: myUid, v: 2
  }).catch(onWriteError);
}

// 儲存支出後呼叫：金額、付款人可能改了，所以先刪掉舊的，再依最新金額重建
function syncExpenseRepayments(e, allChecked, paidBefore) {
  const debts = expenseDebts(e);
  let keep;
  if (allChecked) keep = debts.map(d => d.fromId);                     // 勾選：全部都還了
  else if (debts.length && debts.every(d => paidBefore.includes(d.fromId))) keep = [];   // 原本全還，現在取消勾選
  else keep = paidBefore;                                               // 沒動：保留原本部分還款的人
  transfers.filter(t => t.expenseId === e.id)
    .forEach(t => tripRef().collection('transfers').doc(t.id).delete().catch(onWriteError));
  debts.filter(d => keep.includes(d.fromId)).forEach(d => writeRepayment(e.id, d));
}

function markItemPaid(expenseId, fromId) {
  const e = expenses.find(x => x.id === expenseId);
  const d = e && expenseDebts(e).find(x => x.fromId === fromId);
  if (!d) return;
  writeRepayment(expenseId, d);
}

function undoItemPaid(expenseId, fromId) {
  const t = transfers.find(x => x.expenseId === expenseId && x.fromId === fromId);
  if (!t) return;
  if (!confirm(`取消「${memberName(fromId)} 已還」？`)) return;
  tripRef().collection('transfers').doc(t.id).delete().catch(onWriteError);
}

function renderItemDebts() {
  const list = expenses.filter(e => expenseDebts(e).length)
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  if (!list.length) return '';
  let unpaid = 0;
  const body = list.map(e => {
    const paid = transfers.filter(t => t.expenseId === e.id);
    const rows = expenseDebts(e).map(d => {
      const done = paid.some(t => t.fromId === d.fromId);
      if (!done) unpaid++;
      return `<div class="item-debt ${done ? 'paid' : ''}">
        <span class="txt">${escapeHTML(memberName(d.fromId))} 應還 ${escapeHTML(memberName(d.toId))} ${formatAmount(d.amount, d.currency)}</span>
        ${done
          ? `<button class="undo-btn" onclick="undoItemPaid('${e.id}','${d.fromId}')">✓ 已還</button>`
          : `<button class="done-btn" onclick="markItemPaid('${e.id}','${d.fromId}')">已還</button>`}
      </div>`;
    }).join('');
    const [, m, dd] = e.date.split('-');
    return `<div class="item-exp">
      <div class="head"><span>${escapeHTML(e.title)}</span><small>${Number(m)}/${Number(dd)}・${formatAmount(e.amount, e.currency)}</small></div>
      ${rows}</div>`;
  }).join('');
  return `<div class="card"><details class="items" ${itemsOpen ? 'open' : ''} ontoggle="itemsOpen = this.open">
    <summary><h2>逐筆明細</h2><span class="hint" style="margin:0">${unpaid ? `${unpaid} 項未還` : '全部已還'} <span class="arrow">▶</span></span></summary>
    <p class="hint">一筆一筆確認誰還了。按「已還」後，上方「要怎麼還」會自動扣掉。</p>
    ${body}
  </details></div>`;
}

/* ---------- 啟動（永遠放在 script 最後面，所有變數和函式都定義好之後才執行） ---------- */
startApp();
</script>
